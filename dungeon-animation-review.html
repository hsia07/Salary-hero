<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>薪水勇者｜地獄星期一・動畫戰場</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100914;color:#fff1d6;font-family:system-ui,-apple-system,sans-serif}main{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;background:#211024}#back{position:absolute;inset:0;background:url('art/v4/monday_background.png') center/cover no-repeat}#veil{position:absolute;inset:0;background:linear-gradient(180deg,#12091655 0%,transparent 25%,#10091316 65%,#100913aa 100%);pointer-events:none}.top{position:absolute;top:env(safe-area-inset-top);left:0;right:0;z-index:15;padding:9px 12px;background:linear-gradient(#170e1ed9,#170e1e00);display:flex;align-items:center;justify-content:space-between}.title{font-size:19px;font-weight:900;text-shadow:0 2px 8px #000}.wave{font-size:12px;color:#ffce9d}#bossHud{position:absolute;top:calc(55px + env(safe-area-inset-top));left:4%;width:92%;z-index:14;background:#210d20de;border:1px solid #e1a76b;border-radius:10px;padding:8px 10px;box-shadow:0 5px 25px #0008}.bossName{font-size:14px;font-weight:900;display:flex;justify-content:space-between}.track{height:12px;border:2px solid #efbf8e;border-radius:12px;background:#321b25;overflow:hidden;margin-top:5px}#fill{height:100%;width:100%;background:linear-gradient(90deg,#fc944e,#e22c4d);transition:width .3s}#boss{position:absolute;top:18%;left:50%;width:82%;height:32%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 14px 14px #000b)}#boss img{width:100%;height:100%;object-fit:contain;image-rendering:auto;filter:contrast(1.08)}#boss.hurt{filter:drop-shadow(0 0 24px #f44) brightness(1.12) saturate(1.35)}#boss.charge{animation:slam .6s ease-in-out}#team{position:absolute;inset:0;z-index:8;pointer-events:none}.unit{position:absolute;width:21%;height:12%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;filter:drop-shadow(0 6px 6px #000a)}.unit img{height:83%;max-width:100%;object-fit:contain}.unit .name{font-size:10px;font-weight:800;background:#1b1021c9;padding:2px 5px;border-radius:5px;white-space:nowrap}.unit .life{width:70%;height:4px;border-radius:4px;background:#52e282;box-shadow:0 0 6px #56e99e}.unit.swing{animation:rush .48s ease-out}.unit.hit{filter:brightness(2) sepia(1) saturate(6) hue-rotate(-35deg)}#damage{position:absolute;top:43%;left:50%;transform:translateX(-50%);z-index:12;color:#fff0c0;font-size:36px;font-weight:1000;text-shadow:0 3px 0 #ad2633,0 0 16px #f23;opacity:0;pointer-events:none}#damage.on{animation:damage .7s ease-out}#flash{position:absolute;inset:0;z-index:13;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 55% 40%,#ff6b32aa,transparent 62%)}#flash.on{animation:flash .4s ease-out}footer{position:absolute;bottom:0;left:0;right:0;z-index:16;background:linear-gradient(#301725e8,#160b1bf5);border-top:2px solid #c58a63;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}.status{display:flex;justify-content:space-between;font-size:11px;color:#f4cda6;margin-bottom:7px}.portraits{display:flex;gap:4px;margin-bottom:8px}.portrait{flex:1;min-width:0;aspect-ratio:1.05;border:1px solid #b78061;border-radius:7px;background:#26182a;display:flex;align-items:center;justify-content:center;overflow:hidden}.portrait img{width:100%;height:100%;object-fit:contain}.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}button{min-height:45px;border:1px solid #d5a071;border-radius:10px;background:linear-gradient(#704054,#352039);color:#ffe8cc;font-size:13px;font-weight:800}.note{font-size:9px;color:#bda8af;text-align:center;margin-top:6px}@keyframes rush{45%{transform:translate(-50%,-90%) scale(1.15)}100%{transform:translate(-50%,-50%)}}@keyframes slam{40%{transform:translateX(-50%) translateY(10px) scale(1.1)}100%{transform:translateX(-50%)}}@keyframes damage{15%{opacity:1;transform:translate(-50%,-16px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-64px)}}@keyframes flash{20%{opacity:.8}100%{opacity:0}}@media(max-height:700px){#boss{top:16%;height:31%}.unit{height:12%}footer .portrait{aspect-ratio:1.5}.note{display:none}}
</style></head><body><main><div id="back"></div><div id="veil"></div><div class="top"><span class="title">地獄星期一</span><span class="wave" id="wave">第 1 / 4 波</span></div><div id="bossHud"><div class="bossName"><span>魔王・加班狂課長</span><span id="percent">100%</span></div><div class="track"><div id="fill"></div></div></div><div id="boss"><img id="bossSprite" src="art/v4/monster_idle_00.png" alt="魔王戰鬥動畫"></div><div id="team"></div><div id="damage"></div><div id="flash"></div><footer><div class="status"><span id="message">七人編隊・自動戰鬥中</span><span id="time">×1</span></div><div class="portraits" id="portraits"></div><div class="buttons"><button id="speed">倍速 ×1</button><button id="pause">暫停</button><button id="retry">重新挑戰</button></div><div class="note">技術驗收：角色仍共用舊素材，非正式七人美術</div></footer></main><script>
const boss=document.querySelector('#boss'),sprite=document.querySelector('#bossSprite'),team=document.querySelector('#team'),portraits=document.querySelector('#portraits'),message=document.querySelector('#message');const hero='art/v4/hero_idle_';const names=['打卡守衛','逃班鬥士','截止日刺客','試算表法師','咖啡醫官','機械工程師','薪奴'];const slots=[[19,66],[50,67],[81,66],[19,54],[50,55],[81,54],[50,75]];let wave=1,hp=100,turn=0,speed=1,paused=false,finished=false,lock=false,bossMode='idle',bossFrame=0,heroFrame=0;
const url=(kind,n)=>'art/v4/'+kind+'_'+String(n).padStart(2,'0')+'.png';
for(let i=0;i<7;i++){let u=document.createElement('div');u.className='unit';u.style.left=slots[i][0]+'%';u.style.top=slots[i][1]+'%';u.innerHTML='<img src="'+url('hero_idle',0)+'" alt="'+names[i]+'"><div class="life"></div><div class="name">'+names[i]+'</div>';team.append(u);let p=document.createElement('div');p.className='portrait';p.innerHTML='<img src="'+url('hero_idle',i%6)+'" alt="'+names[i]+'">';portraits.append(p)}
const units=[...team.children];function frame(){if(paused||finished)return;bossFrame++;heroFrame++;const limits={idle:4,attack:6,hurt:3};sprite.src=url('monster_'+bossMode,bossFrame%limits[bossMode]);units.forEach((u,i)=>{if(!u.classList.contains('swing'))u.querySelector('img').src=url('hero_idle',(heroFrame+i)%6)})}setInterval(frame,180);
function combat(){if(paused||finished||lock)return;lock=true;let u=units[turn%7];turn++;u.classList.add('swing');u.querySelector('img').src=url('hero_attack',turn%6);bossMode='hurt';bossFrame=0;boss.classList.add('hurt');let damage=4+Math.floor(Math.random()*7);hp=Math.max(0,hp-damage);document.querySelector('#fill').style.width=hp+'%';document.querySelector('#percent').textContent=hp+'%';let d=document.querySelector('#damage');d.textContent='-'+(damage*1237).toLocaleString();d.classList.remove('on');void d.offsetWidth;d.classList.add('on');setTimeout(()=>{u.classList.remove('swing');boss.classList.remove('hurt');bossMode='idle';if(hp===0){if(wave===4){finished=true;message.textContent='通關！四波自動戰鬥完成';document.querySelector('#wave').textContent='副本通關'}else{wave++;hp=100;document.querySelector('#fill').style.width='100%';document.querySelector('#percent').textContent='100%';document.querySelector('#wave').textContent='第 '+wave+' / 4 波';message.textContent='第 '+wave+' 波・自動推進中'}}else if(turn%4===0){bossMode='attack';bossFrame=0;boss.classList.add('charge');document.querySelector('#flash').classList.add('on');units.forEach(x=>x.classList.add('hit'));setTimeout(()=>{boss.classList.remove('charge');document.querySelector('#flash').classList.remove('on');units.forEach(x=>x.classList.remove('hit'));bossMode='idle'},650)}lock=false},550)}
let ticker=setInterval(()=>{if(!paused&&!finished)combat()},1100);document.querySelector('#speed').onclick=()=>{speed=speed===1?2:speed===2?3:1;document.querySelector('#speed').textContent='倍速 ×'+speed;document.querySelector('#time').textContent='×'+speed;clearInterval(ticker);ticker=setInterval(combat,1100/speed)};document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'繼續':'暫停';message.textContent=paused?'戰鬥暫停':'七人編隊・自動戰鬥中'};document.querySelector('#retry').onclick=()=>{wave=1;hp=100;turn=0;finished=false;paused=false;lock=false;bossMode='idle';document.querySelector('#fill').style.width='100%';document.querySelector('#percent').textContent='100%';document.querySelector('#wave').textContent='第 1 / 4 波';document.querySelector('#pause').textContent='暫停';message.textContent='七人編隊・自動戰鬥中'};
</script></body></html>
