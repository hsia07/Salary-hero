<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>鐵時｜08:59 專武時鐘功能驗收</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#120e1c;color:#f8e7cc;font-family:system-ui,-apple-system,sans-serif;min-height:100svh;display:grid;place-items:center}.app{width:min(100%,430px);padding:20px;display:grid;gap:18px}.top{text-align:center}.top h1{font-size:23px;margin:0 0 8px}.top p{color:#c3b5ca;font-size:13px;margin:0}.shield{position:relative;aspect-ratio:4/5;max-height:52svh;margin:auto;width:min(76vw,260px);border:13px solid #a77b35;border-radius:25% 25% 34% 34%;background:linear-gradient(140deg,#303244,#151523 62%,#27202b);box-shadow:inset 0 0 0 5px #54462c,0 15px 35px #0009;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:20px}.shield:before{content:'';position:absolute;inset:13px;border:2px solid #63543a;border-radius:24% 24% 32% 32%;pointer-events:none}.display{font:700 clamp(35px,11vw,58px)/1 monospace;letter-spacing:-.09em;color:#f3d6ff;background:#080611;padding:14px 12px;border:5px solid #6b6278;border-radius:10px;text-shadow:0 0 12px #d080ff;z-index:1;white-space:nowrap}.mark{font-size:65px;color:#d8a54c;z-index:1}.label{z-index:1;font-weight:700;letter-spacing:.15em;font-size:12px}.shield.awaken{box-shadow:inset 0 0 0 5px #f8c65c,0 0 60px #ffc25190,0 15px 35px #0009;border-color:#ffd879}.shield.awaken .display{color:#ffe3a0;text-shadow:0 0 20px #ffae33}.controls{display:grid;gap:12px;background:#221c2b;padding:16px;border-radius:15px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.row label{font-size:14px}input[type=checkbox]{width:21px;height:21px;accent-color:#d2a457}button{background:#d4a652;color:#211520;font-weight:800;border:0;border-radius:12px;padding:13px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.hint{font-size:12px;color:#bfb2c8;text-align:center;min-height:32px}.tag{font-size:11px;text-align:center;color:#b4a6bd}</style></head><body><main class="app"><header class="top"><h1>終夜打卡盾</h1><p>打卡守衛・鐵時｜時鐘狀態功能驗收</p></header><div class="shield" id="shield" role="img" aria-label="終夜打卡盾，時鐘顯示08:59"><div class="display" id="digits">08:59</div><div class="mark" aria-hidden="true">⌄</div><div class="label">尚未退勤</div></div><section class="controls"><div class="row"><label for="clear">模擬：已通關第三章傳記</label><input type="checkbox" id="clear"></div><button id="ultimate" disabled>施放覺醒必殺（能量 100）</button><div class="hint" id="hint" aria-live="polite">尚未通關傳記，時鐘固定 08:59</div></section><div class="tag">功能原型：盾牌外形為暫用幾何佔位，不是正式美術或分層動畫。</div></main><script type="module">import{tieshiClockTime,canTriggerTieshiAwakenedUltimate}from'./v19/tieshi-clock.mjs';const clear=document.querySelector('#clear'),btn=document.querySelector('#ultimate'),shield=document.querySelector('#shield'),digits=document.querySelector('#digits'),hint=document.querySelector('#hint');let active=false,timer=null;function render(){const biographyCleared=clear.checked;const time=tieshiClockTime({biographyCleared,awakenedUltimateActive:active});digits.textContent=time;shield.classList.toggle('awaken',time==='09:00');shield.setAttribute('aria-label','終夜打卡盾，時鐘顯示'+time);btn.disabled=active||!canTriggerTieshiAwakenedUltimate({biographyCleared,energy:100,cooldownRemaining:0,alive:true});hint.textContent=active?'覺醒必殺啟動：時鐘短暫跳至 09:00':biographyCleared?'傳記已通關，可施放覺醒必殺':'尚未通關傳記，時鐘固定 08:59'}clear.addEventListener('change',()=>{if(!clear.checked){active=false;clearTimeout(timer)}render()});btn.addEventListener('click',()=>{if(btn.disabled)return;active=true;render();timer=setTimeout(()=>{active=false;render()},1800)});render();</script></body></html>
