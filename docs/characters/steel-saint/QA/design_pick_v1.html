<h1>鋼鐵聖女・賽芙｜設計方向挑選（候選草稿）</h1>
<p>依小說設定：救援聖盾、胸甲維修艙、心口「維修前請敲門」金屬牌、被當成神蹟的裂痕、藍色能量長髮、機械羽翼。<br>
<b>這些只用來挑「造型方向」</b>（盾的形狀、羽翼結構、盔甲層次）。畫風、臉部精緻度都還沒到白律的水準；挑定方向後，正式圖會用 ChatGPT 依白律的參考圖畫風重畫。</p>
