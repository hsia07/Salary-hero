<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>薪水勇者｜第六隻・加班遊魂文員・高清 512px 逐格試播</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;background:#110c23;color:#ffe5bf}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 45% 4%,#463361,#110b1e 71%);min-height:100vh}
main{max-width:820px;margin:auto;padding:15px 10px 34px}
h1{font-size:clamp(24px,6vw,36px);margin:0;color:#ffe2a2}
p{font-size:13px;line-height:1.65;color:#ddc4e0}
.tag{font-size:11px;border:1px solid #d5ad81;border-radius:99px;padding:7px 11px;background:#3b264b;color:#ffeac2}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.arena{border:3px solid #d5a76d;border-radius:13px;background:#241736;overflow:hidden;box-shadow:0 13px 33px #0008}
canvas#stage{display:block;width:100%;height:auto;aspect-ratio:720/450}
.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px}
button{min-height:48px;border:2px solid #ba8f76;border-radius:8px;color:#ffe2bf;background:linear-gradient(#73465f,#3c2b4b);font:800 12px system-ui;cursor:pointer}
button.selected{border-color:#fff1bb;background:linear-gradient(#a36c7c,#60406a)}
#cue{padding:11px;font-size:12px;font-weight:750;text-align:center;color:#ffd8fd;border-top:1px solid #63456f;background:#2f2142;min-height:39px}
.notes{border:1px solid #7d657d;border-radius:10px;padding:10px 12px;margin:12px 0;background:#251c35}
.notes b{color:#ffe2a3}
#all{display:grid;gap:11px}
.frame{border:1px solid #745a7b;border-radius:10px;background:#271e38;padding:8px}
.frame b{font-size:13px;color:#f5d6aa}
.sheet{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin-top:8px}
.thumb{background:radial-gradient(#47305b,#22172e);border:1px solid #5b4672;border-radius:7px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb canvas{width:100%;height:auto}
a{color:#ffdb9b}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<main>
<header><div><h1>👻 加班遊魂文員</h1><p style="margin:4px 0">第 6 隻普通怪・面向左邊勇者・獨立 16 格動作</p></div><span class="tag">美術候選｜正式 5／32</span></header>
<div class="arena"><canvas id="stage" width="720" height="450" aria-label="第六隻加班遊魂文員的原始逐格動畫"></canvas>
<div class="controls">
<button class="selected" data-state="idle">待機 4 格</button>
<button data-state="attack">詛咒報表 5 格</button>
<button data-state="hurt">受擊紅閃 3 格</button>
<button data-state="defeat">消散死亡 4 格</button>
</div><div id="cue">正在載入透明原畫格……</div></div>
<div class="notes"><b>造型定位：</b>邪惡又疲憊的紫黑髮人形上班族怨靈，歪領帶、加班頭帶、幽靈火、詛咒文件。攻擊真正朝左；四個動作分別使用獨立的原畫格，而不是整張圖擺動。<p>這次重新繪製成高清 512×512 單格：頭髮、眼神、襯衫、領帶、筆電和報表攻擊都更清晰，保留完整 16 格獨立姿勢。你確認前仍不計入正式完成數，也不更動遊戲存檔。</p><a href="./play.html?training=keyboard-piranha">前往第 26 關實際戰鬥</a></div>
<section id="all" aria-label="完整 16 格畫格檢查"></section>
</main>
<script>
const stage=document.querySelector('#stage'),ctx=stage.getContext('2d');
const status=document.querySelector('#cue'),framesPanel=document.querySelector('#all');
const states=['idle','attack','hurt','defeat'];
const names={idle:'陰森巡邏',attack:'飛出詛咒報表',hurt:'受擊白閃紅閃',defeat:'人形消散為鬼火'};
const atlas={};let selected='idle',start=performance.now(),loaded=false;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function indexFor(times,elapsed,loop){
 const total=times.reduce((a,b)=>a+b,0);
 let left=loop?elapsed%total:Math.min(elapsed,total-.001);
 for(let i=0;i<times.length;i++){if(left<times[i])return i;left-=times[i]}return times.length-1;
}
function pose(state,idx){
 const f=atlas[state].frame,im=atlas[state].image;
 return [im,idx*f.cell,0,f.cell,f.cell];
}
function startState(s){selected=s;start=performance.now();document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('selected',b.dataset.state===s));status.textContent=names[s]+'｜真正的原始畫格 '+atlas[s].frame.frames+' 格';}
for(const btn of document.querySelectorAll('[data-state]'))btn.onclick=()=>{if(loaded)startState(btn.dataset.state)};
function glow(x,y,r,c){const gr=ctx.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,c);gr.addColorStop(1,'#0000');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function background(t){
 const g=ctx.createLinearGradient(0,0,0,450);g.addColorStop(0,'#201532');g.addColorStop(.7,'#3d284f');g.addColorStop(1,'#171026');
 ctx.fillStyle=g;ctx.fillRect(0,0,720,450);
 glow(464,180,190,'#9c64ee33');glow(140,160,135,'#ffac7833');
 for(let i=0;i<18;i++){
  const x=i*46-17,h=40+(i*31)%121,y=335-h;
  ctx.fillStyle=i%3?'#29213b':'#35253e';ctx.fillRect(x,y,35+(i%4)*9,h);
  for(let j=0;j<4;j++){ctx.fillStyle='#b6a0dc3d';ctx.fillRect(x+6+j*11,y+12,5,6);}
 }
 ctx.fillStyle='#594063';ctx.fillRect(0,340,720,110);
 ctx.strokeStyle='#896a83';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,348);ctx.lineTo(720,348);ctx.stroke();
 for(let i=0;i<12;i++){const x=(i*76+Math.sin(t/1000+i)*14)%720;glow(x,65+i*18,7,'#e2a4ff60');}
}
function tint(image,index,cell,color,x,y,w,h,opacity){
 const c=document.createElement('canvas');c.width=cell;c.height=cell;
 const d=c.getContext('2d');d.drawImage(image,index*cell,0,cell,cell,0,0,cell,cell);
 d.globalCompositeOperation='source-in';d.fillStyle=color;d.fillRect(0,0,cell,cell);
 ctx.save();ctx.globalAlpha=opacity;ctx.drawImage(c,x,y,w,h);ctx.restore();
}
function paint(now){
 background(now);
 if(loaded){
  const f=atlas[selected].frame,age=now-start,total=f.durations.reduce((a,b)=>a+b,0);
  const i=indexFor(f.durations,age,selected==='idle');
  const size=310,x=470-size/2,y=355-size*f.ground_y/f.cell;
  const [im,sx,sy,sw,sh]=pose(selected,i);
  ctx.drawImage(im,sx,sy,sw,sh,x,y,size,size);
  if(selected==='hurt'&&age<310){
   const white=age<42?.90*(1-age/42):0,red=age>=42?.8*(1-clamp((age-42)/268,0,1)):0;
   if(white>.0)tint(im,i,sw,'#fff2fd',x,y,size,size,white);
   if(red>.0)tint(im,i,sw,'#ff2746',x,y,size,size,red);
  }
  if(selected==='attack'&&age>=450&&age<660){
   const u=clamp((age-450)/210,0,1),x=450-290*u,y=218-36*Math.sin(u*Math.PI);
   glow(x,y,55,'#cd72ff84');
   ctx.save();ctx.translate(x,y);ctx.rotate(-.18);ctx.strokeStyle='#f5d4ff';ctx.fillStyle='#c79ef4';ctx.lineWidth=3;ctx.fillRect(-14,-20,28,39);ctx.strokeRect(-14,-20,28,39);ctx.restore();
  }
  if(selected!=='idle'&&age>total+470)startState('idle');
 }else{ctx.textAlign='center';ctx.fillStyle='#ffdfa7';ctx.font='700 21px system-ui';ctx.fillText('逐格素材載入中……',360,210);}
 requestAnimationFrame(paint);
}
async function load(){
 const source=await fetch('../art/v19/candidates/monsters/keyboard-piranha/hd/manifest-hd-candidate.json?v=clerk22');
 if(!source.ok)throw Error('candidate manifest HTTP '+source.status);
 const m=await source.json();
 if(m.id!=='keyboard-piranha'||m.approved!==false||Object.values(m.states).some(s=>s.cell!==512))throw Error('高清候選圖集識別錯誤');
 for(const s of states){
  const frame=m.states[s],im=new Image();
  im.src=frame.src;await im.decode();
  if(im.naturalWidth!==frame.cell*frame.frames||im.naturalHeight!==frame.cell)throw Error(s+' atlas dimensions');
  atlas[s]={image:im,frame};
  const item=document.createElement('div');item.className='frame';const title=document.createElement('b');
  title.textContent=names[s]+'｜'+frame.frames+' 個姿勢';item.appendChild(title);
  const sheet=document.createElement('div');sheet.className='sheet';
  for(let i=0;i<frame.frames;i++){
   const el=document.createElement('div');el.className='thumb';const c=document.createElement('canvas');
   c.width=112;c.height=112;c.getContext('2d').drawImage(im,i*frame.cell,0,frame.cell,frame.cell,0,0,112,112);
   el.appendChild(c);sheet.appendChild(el);
  }
  item.appendChild(sheet);framesPanel.appendChild(item);
 }
 loaded=true;startState('idle');
}
load().catch(err=>{status.textContent='無法載入候選圖集：'+err.message});
requestAnimationFrame(paint);
</script></body></html>
