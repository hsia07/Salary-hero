<style>
:root{--ink:#17121c;--gold:#d8b25a;--gold2:#f3dfa0;--violet:#2a1d3d;--panel:#1b1328}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0914;overflow:hidden;font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;color:#efe6d2}
#fit{position:absolute;left:50%;top:0;width:390px;height:700px;transform-origin:0 0}
#stage{position:absolute;left:0;top:0;width:390px;height:470px;overflow:hidden;background:#120c1c}
#bg{position:absolute;left:-78px;top:0;width:546px;height:470px;background:url(../art/v20/runtime/backgrounds/battle-library-v20-p10.webp) center/cover}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(10,6,18,.72) 100%)}
#world{position:absolute;inset:0}
.shadow{position:absolute;width:96px;height:20px;border-radius:50%;background:radial-gradient(closest-side,rgba(8,4,14,.62),transparent);transform:translate(-50%,-50%)}
#bailu{position:absolute;width:186px;height:186px;left:0;top:0;will-change:transform}
#bailu svg{width:100%;height:100%;overflow:visible;display:block}
#foe{position:absolute;width:200px;height:200px;left:192px;top:214px;will-change:transform}
#foeSprite{width:200px;height:200px;background:url(../art/v19/runtime/monsters/chair-golem/idle.webp) 0 0/800px 200px;animation:foeIdle .9s steps(4) infinite}
#foe.hurt #foeSprite{background-image:url(../art/v19/runtime/monsters/chair-golem/hurt.webp);background-size:600px 200px;animation:foeHurt .33s steps(3) 1 forwards}
@keyframes foeIdle{to{background-position:-800px 0}}
@keyframes foeHurt{to{background-position:-600px 0}}
#aura{position:absolute;left:30px;top:150px;width:140px;height:44px;border-radius:50%;border:2px solid rgba(255,90,70,.9);box-shadow:0 0 14px 4px rgba(255,70,50,.55),inset 0 0 12px rgba(255,90,70,.6);animation:auraPulse 1.1s ease-in-out infinite;opacity:0;transition:opacity .25s}
#aura.on{opacity:1}
@keyframes auraPulse{50%{transform:scale(1.06);filter:brightness(1.3)}}
.bar{position:absolute;height:7px;border-radius:4px;background:#0c0812;border:1px solid var(--gold);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(#ffe9a8,#c9963a);transition:width .25s}
.bar.foe i{background:linear-gradient(#ff9a84,#b8322a)}
.tag{position:absolute;font-size:11px;letter-spacing:.12em;color:var(--gold2);text-shadow:0 1px 2px #000}
#fx{position:absolute;inset:0;pointer-events:none;overflow:visible}
.num{position:absolute;font:900 24px/1 "Noto Serif TC",serif;color:#fff3c9;-webkit-text-stroke:1px #5a2b12;text-shadow:0 2px 0 #2a1208,0 0 10px rgba(255,200,90,.7);animation:numUp .8s cubic-bezier(.2,.9,.3,1) forwards;white-space:nowrap}
.num.hurt{color:#ffb3a5;-webkit-text-stroke:1px #5a1010}
.num.word{font-size:19px;letter-spacing:.2em;color:#fffbe6}
@keyframes numUp{0%{transform:translate(-50%,0) scale(.5);opacity:0}18%{transform:translate(-50%,-14px) scale(1.25);opacity:1}100%{transform:translate(-50%,-52px) scale(1);opacity:0}}
.shake{animation:shake .22s linear}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(4px,-3px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,2px)}}
#flash{position:absolute;inset:0;background:#fff7dc;opacity:0;pointer-events:none}
#panel{position:absolute;left:0;top:470px;width:390px;height:230px;background:linear-gradient(#241836,#140d1f);border-top:2px solid var(--gold);box-shadow:inset 0 10px 24px rgba(0,0,0,.45);padding:14px 16px}
#panel h1{margin:0 0 2px;font-size:17px;letter-spacing:.14em;color:var(--gold2)}
#panel p{margin:0 0 12px;font-size:11.5px;line-height:1.5;color:#b9aecb}
.btns{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
button{appearance:none;border:1px solid var(--gold);border-radius:8px;background:linear-gradient(#3a2957,#22173a);color:#f6ecd0;font:600 15px/1 inherit;letter-spacing:.2em;padding:13px 0;box-shadow:inset 0 1px 0 rgba(255,235,170,.25),0 3px 0 #0b0712;cursor:pointer}
button:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,235,170,.25),0 1px 0 #0b0712}
button:disabled{opacity:.45}
button.wide{grid-column:1/-1;background:linear-gradient(#6a5220,#3d2e12)}
</style>

 <div id="panel">
  <h1>勞權律師・白律｜動作樣品</h1>
  <p>角色為程式繪製的分層骨架（非生圖），背景與敵人是遊戲既有素材。獨立測試頁，不影響存檔。</p>

<script type="module">
const $=s=>document.querySelector(s),fit=$('#fit'),world=$('#world'),fx=$('#fx'),bailu=$('#bailu'),foe=$('#foe');
function resize(){const s=Math.min(innerWidth/390,innerHeight/700);fit.style.transform=`translateX(${-195*s}px) scale(${s})`;}
addEventListener('resize',resize);resize();

/* ── 骨架 ── */
const HOME={x:104,y:398},FOE={x:292,y:398},K=.62;
const REST={x:0,y:0,lean:0,sq:1,body:0,head:0,aU:8,aF:-14,pen:62,bU:-6,bF:-4,cs:8,lL:0,lR:0,tail:0};
const P={...REST};
const el={root:$('#root'),tB:$('#tailB'),tF:$('#tailF'),lL:$('#legL'),lR:$('#legR'),head:$('#head'),aU:$('#aU'),aF:$('#aF'),pen:$('#pen'),bU:$('#bU'),bF:$('#bF'),cs:$('#case'),eyes:$('#eyes'),body:[...document.querySelectorAll('.bodyRot')]};
let t0=performance.now(),blinkAt=1.6,busy=false,hitstop=0;
function render(now){
 const t=(now-t0)/1000,idle=busy?.35:1,br=Math.sin(t*2.1),sw=Math.sin(t*1.3+.6);
 const body=P.body+br*.9*idle,by=br*1.3*idle;
 el.root.setAttribute('transform',`rotate(${P.lean}) scale(1,${P.sq})`);
 for(const g of el.body)g.setAttribute('transform',`translate(0,${by}) rotate(${body},0,-84)`);
 el.head.setAttribute('transform',`rotate(${P.head+sw*1.6*idle},2,-152)`);
 el.aU.setAttribute('transform',`rotate(${P.aU+br*1.6*idle})`);el.aF.setAttribute('transform',`translate(0,29) rotate(${P.aF-br*1.2*idle})`);el.pen.setAttribute('transform',`translate(0,32) rotate(${P.pen})`);
 el.bU.setAttribute('transform',`rotate(${P.bU-br*1.2*idle})`);el.bF.setAttribute('transform',`translate(0,29) rotate(${P.bF})`);el.cs.setAttribute('transform',`translate(0,32) rotate(${P.cs+sw*1.5*idle})`);
 el.lL.setAttribute('transform',`rotate(${P.lL},-9,-82)`);el.lR.setAttribute('transform',`rotate(${P.lR},11,-82)`);
 const tail=P.tail+sw*2.6*idle;el.tB.setAttribute('transform',`rotate(${tail*.7},0,-88)`);el.tF.setAttribute('transform',`rotate(${tail},0,-88) skewX(${-tail*.8})`);
 let bl=1;const d=t-blinkAt;if(d>0){bl=d<.07?1-d/.07:d<.14?(d-.07)/.07:1;if(d>.14)blinkAt=t+2.2+Math.random()*2.4;}
 el.eyes.setAttribute('transform',`translate(0,${-197*(1-Math.max(.12,bl))}) scale(1,${Math.max(.12,bl)})`);
 const px=HOME.x+P.x,py=HOME.y+P.y;
 bailu.style.transform=`translate(${px-130*K}px,${py-285*K}px)`;
 $('#shB').style.cssText=`left:${px}px;top:${HOME.y}px;opacity:${1+P.y/60};width:${96+P.y*.6}px`;
 $('#hpB').style.cssText=`left:${px-33}px;top:${py-176}px;width:66px`;$('#tagB').style.cssText=`left:${px-12}px;top:${py-193}px`;
 requestAnimationFrame(render);
}
requestAnimationFrame(render);

const E={lin:u=>u,out:u=>1-(1-u)**3,in:u=>u**3,io:u=>u<.5?4*u**3:1-(-2*u+2)**3/2,back:u=>1+2.7*(u-1)**3+1.7*(u-1)**2};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function to(target,ms,ease='out'){return new Promise(res=>{const from={...P},s=performance.now();(function step(n){if(hitstop>n){requestAnimationFrame(step);return;}const u=Math.min(1,(n-s)/ms),e=E[ease](u);for(const k in target)P[k]=from[k]+(target[k]-from[k])*e;u<1?requestAnimationFrame(step):res();})(s);});}

/* ── 特效（金白審判光，全部獨立於角色圖層）── */
const NS='http://www.w3.org/2000/svg';
function svgFx(x,y,w,h,inner,life){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',`${-w/2} ${-h/2} ${w} ${h}`);s.style.cssText=`position:absolute;left:${x-w/2}px;top:${y-h/2}px;width:${w}px;height:${h}px;overflow:visible`;s.innerHTML=inner;fx.appendChild(s);setTimeout(()=>s.remove(),life);return s;}
function spark(x,y,big){let rays='';const n=big?12:8;for(let i=0;i<n;i++){const a=i/n*6.283+Math.random()*.3,r1=6,r2=(big?46:30)*(.6+Math.random()*.5);rays+=`<path d="M${Math.cos(a)*r1},${Math.sin(a)*r1} L${Math.cos(a)*r2},${Math.sin(a)*r2}" stroke="${i%2?'#fff':'#f6dc8a'}" stroke-width="${i%2?2.4:3.4}" stroke-linecap="round"/>`;}
 const s=svgFx(x,y,120,120,`<g><circle r="${big?16:11}" fill="#fffbe8"/><circle r="${big?26:18}" fill="none" stroke="#f3d27a" stroke-width="3"/>${rays}</g>`,260);
 s.firstChild.animate([{transform:'scale(.3)',opacity:1},{transform:'scale(1.15)',opacity:1,offset:.45},{transform:'scale(1.4)',opacity:0}],{duration:250,easing:'cubic-bezier(.1,.8,.3,1)'});}
function trail(x1,y,x2){const w=x2-x1;const s=svgFx(x1+w/2,y,w,40,`<defs><linearGradient id="tg"><stop offset="0" stop-color="#f6dc8a" stop-opacity="0"/><stop offset="1" stop-color="#fffdf2"/></linearGradient></defs><path d="M${-w/2},0 L${w/2},-3.5 L${w/2+10},0 L${w/2},3.5Z" fill="url(#tg)"/>`,200);s.animate([{opacity:1},{opacity:0}],{duration:190});}
function num(x,y,txt,cls=''){const d=document.createElement('div');d.className='num '+cls;d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';fx.appendChild(d);setTimeout(()=>d.remove(),820);}
function shake(){world.classList.remove('shake');void world.offsetWidth;world.classList.add('shake');}
function stop(ms){hitstop=performance.now()+ms;}
function seal(x,y){let ticks='';for(let i=0;i<24;i++){const a=i/24*6.283;ticks+=`<path d="M${Math.cos(a)*50},${Math.sin(a)*50} L${Math.cos(a)*(i%3?55:60)},${Math.sin(a)*(i%3?55:60)}" stroke="#f6dc8a" stroke-width="2"/>`;}
 const s=svgFx(x,y,220,220,`<g class="ring" fill="none"><circle r="62" stroke="#fff8dc" stroke-width="2.5"/><circle r="46" stroke="#f3d27a" stroke-width="1.6" stroke-dasharray="5 7"/>${ticks}<path d="M0,-40 L35,20 L-35,20Z" stroke="#fff8dc" stroke-width="1.6"/></g><path class="strike" d="M-92,10 L92,-10" stroke="#fffdf2" stroke-width="7" stroke-linecap="round" fill="none" style="filter:drop-shadow(0 0 6px #f6dc8a)"/><path class="pillar" d="M-9,-170 L9,-170 L3,60 L-3,60Z" fill="#fff8dc" opacity=".0"/>`,900);
 s.querySelector('.ring').animate([{transform:'scale(.2) rotate(-80deg)',opacity:0},{transform:'scale(1) rotate(0deg)',opacity:1,offset:.35},{transform:'scale(1.05) rotate(14deg)',opacity:1,offset:.75},{transform:'scale(1.3) rotate(22deg)',opacity:0}],{duration:880,easing:'ease-out'});
 const st=s.querySelector('.strike');st.style.strokeDasharray='190';st.animate([{strokeDashoffset:190,opacity:1},{strokeDashoffset:190,opacity:1,offset:.38},{strokeDashoffset:0,opacity:1,offset:.52},{strokeDashoffset:0,opacity:0}],{duration:880});
 s.querySelector('.pillar').animate([{opacity:0},{opacity:0,offset:.4},{opacity:.85,offset:.5},{opacity:0,offset:.8},{opacity:0}],{duration:880});}
function shards(x,y){for(let i=0;i<10;i++){const a=Math.random()*6.283,d=40+Math.random()*50;const s=svgFx(x,y,20,20,`<path d="M0,-7 L5,4 L-5,3Z" fill="#ff6a55" stroke="#ffd0c4" stroke-width="1"/>`,600);s.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d*.6+30}px) rotate(${Math.random()*500-250}deg)`,opacity:0}],{duration:580,easing:'cubic-bezier(.1,.7,.4,1)'});}}

/* ── 敵人 ── */
let hpF=100,hpB=100;
const setHp=()=>{$('#hpF i').style.width=hpF+'%';$('#hpB i').style.width=hpB+'%';};
function foeHit(dmg,big){foe.classList.remove('hurt');void foe.offsetWidth;foe.classList.add('hurt');setTimeout(()=>foe.classList.remove('hurt'),340);
 foe.animate([{transform:'translateX(0)'},{transform:`translateX(${big?22:13}px)`,offset:.25},{transform:'translateX(0)'}],{duration:300,easing:'ease-out'});
 hpF=hpF-dmg<=0?100:hpF-dmg;setHp();num(FOE.x,FOE.y-150,dmg);}
const foeLunge=(ms=220)=>foe.animate([{transform:'translateX(0)'},{transform:'translateX(-18px) rotate(4deg)',offset:.3},{transform:'translateX(-118px) rotate(-6deg)',offset:.62},{transform:'translateX(-118px) rotate(-6deg)',offset:.72},{transform:'translateX(0)'}],{duration:ms*3,easing:'ease-in-out'});

/* ── 動作 ── */
async function thrust(dmg,big){
 await to({lean:-9,body:-10,aU:42,aF:-78,pen:96,lL:10,lR:-6,x:-10,sq:.96,tail:10},150,'out');                 // 預備：收筆蓄力
 const reach=FOE.x-HOME.x-112;
 to({x:reach,lean:13,body:12,lL:30,lR:-34,tail:-26,sq:1},130,'in');await wait(70);                                // 踏步突進
 await to({aU:-84,aF:-6,pen:90,head:-4},75,'out');                                                               // 出筆：筆尖到達敵人身體
 const tipX=HOME.x+P.x+66,tipY=HOME.y-88;trail(tipX-90,tipY,tipX);spark(tipX+4,tipY,big);foeHit(dmg,big);shake();stop(big?95:60);
 await wait(big?120:80);
 await to({x:reach-14,lean:4,body:2,aU:-50,aF:-30,lL:8,lR:-8,tail:8},120,'out');                                 // 收招
 to({x:0,y:0,lean:-4,lL:-14,lR:16,tail:14},210,'io');await to({y:-16},105,'out');await to({y:0},105,'in');       // 後跳回位
 await to(REST,160,'out');
}
async function attack(){await thrust(18+Math.floor(Math.random()*7));}
async function hurt(){
 const a=foeLunge();await wait(400);
 bailu.querySelector('#root').setAttribute('filter','url(#red)');spark(HOME.x+34,HOME.y-92);shake();stop(60);
 hpB=hpB-14<=0?100:hpB-14;setHp();num(HOME.x,HOME.y-150,14,'hurt');
 await to({x:-24,lean:-17,body:-12,head:16,aU:34,aF:-30,bU:30,bF:-20,lL:-16,lR:14,tail:-22,sq:.94},110,'out');
 setTimeout(()=>el.root.removeAttribute('filter'),150);
 await wait(140);await to({x:-10,lean:-5,body:-3,head:5,sq:1,tail:8},180,'io');await to(REST,220,'io');await a.finished;
}
async function block(){
 const a=foeLunge();
 await to({bU:-64,bF:-52,cs:112,lean:6,body:6,lL:14,lR:-14,aU:26,aF:-40,sq:.97},210,'back');                     // 公文包盾舉到受擊方向
 await wait(190);
 spark(HOME.x+62,HOME.y-86,true);shake();stop(80);num(HOME.x+10,HOME.y-150,'格擋','word');
 await to({x:-12,lean:-4,bU:-52,bF:-58,tail:-12},90,'out');await wait(120);
 await to({x:0,lean:0,bU:-30,bF:-30,cs:60,tail:4},140,'io');await a.finished;
 num(HOME.x+6,HOME.y-150,'反擊','word');await thrust(30+Math.floor(Math.random()*8),true);                        // 反擊定位
}
async function dispel(){
 await to({lean:-5,body:-6,head:-8,aU:-150,aF:-24,pen:-60,bU:8,lL:6,lR:-4,tail:8},260,'out');                     // 舉筆
 await wait(120);
 to({aU:-58,aF:-12,pen:72,lean:7,body:8,head:2,tail:-14},150,'in');                                              // 落筆一劃
 seal(FOE.x,FOE.y-78);await wait(380);
 $('#flash').animate([{opacity:.5},{opacity:0}],{duration:260});shards(FOE.x,FOE.y-40);$('#aura').classList.remove('on');foeHit(9);num(FOE.x,FOE.y-176,'無效條款','word');shake();
 await wait(420);await to(REST,260,'io');
 setTimeout(()=>$('#aura').classList.add('on'),4200);
}
const ACT={attack,hurt,block,dispel,async auto(){for(const k of ['attack','attack','hurt','block','dispel','attack']){await ACT[k]();await wait(260);}}};
const btns=[...document.querySelectorAll('button')];
for(const b of btns)b.addEventListener('click',async()=>{if(busy)return;busy=true;btns.forEach(x=>x.disabled=true);try{await ACT[b.dataset.act]();}finally{Object.assign(P,REST);busy=false;btns.forEach(x=>x.disabled=false);}});
window.__sample={ACT,P,REST};
</script>
