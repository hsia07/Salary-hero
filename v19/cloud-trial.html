<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>薪水勇者｜雲端資料專員靈｜16 格角色動畫</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#110c24;color:#ffebc5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#4b3064,#120b22 67%)}
main{max-width:850px;padding:20px 12px 34px;margin:auto}
h1{font-size:clamp(24px,6vw,38px);color:#ffe09b;margin:0}
p{color:#dac5dd;font-size:13px;line-height:1.7}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.tag{padding:7px 10px;font-size:12px;border:1px solid #b28ec2;border-radius:20px;background:#362441}
.scene{border:3px solid #ddab74;border-radius:14px;overflow:hidden;background:#2b1d37;box-shadow:0 12px 45px #0b0411bb}
canvas#arena{width:100%;aspect-ratio:720/440;display:block}
.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:8px}
button{cursor:pointer;padding:10px 4px;min-height:45px;font-weight:850;font-size:12px;color:#ffedca;border:1px solid #dfa773;border-radius:8px;background:linear-gradient(#77496b,#3e2b4a)}
button.active{border:2px solid #ffe2a1;background:linear-gradient(#a96485,#61365d)}
#status{text-align:center;padding:9px 8px;font-weight:750;font-size:12px;color:#fbe0e9;background:#34233f;border-top:1px solid #805b83}
.note{border:1px solid #755f8a;border-radius:12px;padding:11px;margin:12px 0;background:#241a36}
.preview-rows{display:grid;gap:9px;margin:16px 0}
.row{background:#261b36;border:1px solid #6f5276;border-radius:11px;padding:10px}
.row strong{font-size:13px;color:#ffe09e}
.thumbs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin-top:9px}
.thumbs canvas{width:100%;aspect-ratio:1/1;background:radial-gradient(#493159,#22182e);border:1px solid #6d5577;border-radius:8px}
a{color:#ffd49e}footer{font-size:12px;color:#b8a7c8}
</style></head><body><main>
<header><div><h1>☁️ 雲端資料專員靈</h1><p>第 5 隻普通怪 · 面向左邊勇者 · 16 格透明候選</p></div><span class="tag">美術待驗收 · 正式 3／32</span></header>
<div class="scene"><canvas id="arena" width="720" height="440" aria-label="雲端資料專員靈從右側向左側施放時鐘魔法"></canvas>
<div class="controls"><button data-state="idle" class="active">待機 4 格</button><button data-state="attack">時鐘攻擊 5 格</button><button data-state="hurt">受擊紅閃 3 格</button><button data-state="defeat">消散死亡 4 格</button></div>
<div id="status">載入逐格圖集……</div></div>
<div class="note"><b>真正的角色圖集，不是功能面板。</b><p>使用已清除透明雜訊的原創圖，顯示不同手部、頭部、文件、時鐘、受擊與消散姿勢。時鐘由右向左飛往勇者；獨立練習不會變動你的遊戲進度。這是普通怪候選，未正式核准。</p></div>
<section class="preview-rows" id="rows"></section>
<p><a href="./play.html?training=deadline-clock">⚔️ 開啟第 6 關｜真正的戰鬥練習（不修改存檔）</a></p>
<footer>動畫以四份透明 WebP 串接，所有 16 格都會逐格呈現。尚未通過玩家正式美術核准。</footer>
</main>
<script type="module">
import {spriteFrameIndex} from './sprite-atlas.mjs';
import {drawCloudClockFx,drawCloudHurtTint,CLOUD_ATTACK_START_MS,CLOUD_HERO_HIT_MS} from './cloud-ghost-combat.mjs';
const canvas=document.querySelector('#arena'),ctx=canvas.getContext('2d');
const status=document.querySelector('#status'),rows=document.querySelector('#rows');
let asset={},manifest,mode='idle',start=performance.now(),hero=null;
document.querySelectorAll('button[data-state]').forEach(button=>button.addEventListener('click',()=>{
 mode=button.dataset.state;start=performance.now();
 for(const node of document.querySelectorAll('button[data-state]'))
  node.classList.toggle('active',node.dataset.state===mode);
}));
function background(){
 const g=ctx.createLinearGradient(0,0,0,440);
 g.addColorStop(0,'#2e2250');g.addColorStop(.64,'#3f2d51');g.addColorStop(1,'#281b37');
 ctx.fillStyle=g;ctx.fillRect(0,0,720,440);
 ctx.fillStyle='#312747';
 for(let i=0;i<14;i++)ctx.fillRect(i*57-12,220+(i%4)*16,38,140);
 ctx.fillStyle='#534064';ctx.fillRect(0,356,720,84);
 ctx.strokeStyle='#b78db2';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,355);ctx.lineTo(720,355);ctx.stroke();
 ctx.font='800 15px system-ui';ctx.fillStyle='#fbe3b5';ctx.textAlign='center';
 ctx.fillText('勇者（左）',164,43);ctx.fillText('雲端資料專員靈（右）',510,43);
}
function render(t){
 background();
 if(hero){ctx.save();ctx.translate(310,0);ctx.scale(-1,1);ctx.drawImage(hero,18,137,264,264);ctx.restore();}
 if(manifest&&asset[mode]){
  const record=manifest.states[mode],image=asset[mode],list=record.durations,total=list.reduce((a,b)=>a+b,0);
  const elapsed=t-start,frameElapsed=mode==='idle'?elapsed%total:Math.min(elapsed,total-.001);
  const index=spriteFrameIndex(list,frameElapsed,mode==='idle');
  const rect={x:364,y:356-310*(record.ground_y/record.cell),w:310,h:310};
  ctx.drawImage(image,index*384,0,384,384,rect.x,rect.y,rect.w,rect.h);
  if(mode==='hurt')drawCloudHurtTint(ctx,image,record,index,rect,CLOUD_HERO_HIT_MS+elapsed);
  if(mode==='attack')drawCloudClockFx(ctx,CLOUD_ATTACK_START_MS+elapsed,
   {enemyX:453,enemyY:168,heroX:100,heroY:182,canRetaliate:true});
  const label=({idle:'邪惡雲端文書巡邏',attack:'截止時鐘朝勇者施放',hurt:'獨立受擊姿勢＋全身紅閃',defeat:'幽靈瓦解為雲霧'})[mode]+'｜第 '+(index+1)+'／'+record.frames+' 格';
  if(status.textContent!==label)status.textContent=label;
  if(elapsed>total+750&&mode!=='idle'){mode='idle';start=t;for(const b of document.querySelectorAll('button[data-state]'))b.classList.toggle('active',b.dataset.state==='idle');}
 }
 requestAnimationFrame(render);
}
const loadImage=url=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=url;});
async function load(){
 const base='../art/v19/candidates/monsters/deadline-clock/';
 const r=await fetch(base+'manifest-candidate.json');if(!r.ok)throw Error('manifest HTTP '+r.status);
 manifest=await r.json();
 if(manifest.id!=='deadline-clock'||manifest.approved!==false)throw Error('這不是第五隻候選');
 for(const state of ['idle','attack','hurt','defeat']){
  const record=manifest.states[state],img=await loadImage(base+state+'.webp');
  if(img.naturalWidth!==384*record.frames||img.naturalHeight!==384)throw Error('不合格畫格 '+state);
  asset[state]=img;
  const row=document.createElement('div');row.className='row';
  const heading=document.createElement('strong');
  heading.textContent=({idle:'待機',attack:'時鐘攻擊',hurt:'受擊',defeat:'死亡'})[state]+' · '+record.frames+' 個不同姿勢';
  row.appendChild(heading);
  const group=document.createElement('div');group.className='thumbs';
  for(let i=0;i<record.frames;i++){
   const el=document.createElement('canvas');el.width=128;el.height=128;
   el.getContext('2d').drawImage(img,i*384,0,384,384,0,0,128,128);
   group.appendChild(el);
  }
  row.appendChild(group);rows.appendChild(row);
 }
 try{hero=await loadImage('../art/v19/candidates/characters/starter/chibi/idle-candidate.webp')}catch{}
 status.textContent='已載入完整 16 格透明候選，點擊任一動作試播。';
}
load().catch(e=>{status.textContent='素材載入失敗：'+e.message;console.error(e)});
requestAnimationFrame(render);
</script></body></html>
