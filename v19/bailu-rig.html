<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>白律 分層動作驗收</title>
<style>
html,body{margin:0;height:100%;background:#0d0914;color:#efe6d2;font-family:"Noto Serif TC","Microsoft JhengHei",serif;overflow:hidden}
#stage{position:relative;width:100%;height:62vh;max-width:520px;margin:0 auto;overflow:hidden;background:url(../art/v20/runtime/backgrounds/battle-library-v20-p10.webp) center 70%/cover}
#stage::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 50%,#0a0612b8);pointer-events:none}
#foe{position:absolute;width:150px;height:150px;bottom:7%;right:6%;background:url(../art/v19/runtime/monsters/chair-golem/idle.webp) 0 0/600px 150px;animation:foe .9s steps(4) infinite}
#foe.hurt{background-image:url(../art/v19/runtime/monsters/chair-golem/hurt.webp);background-size:450px 150px;animation:foeh .33s steps(3) 1 forwards}
@keyframes foe{to{background-position:-600px 0}}@keyframes foeh{to{background-position:-450px 0}}
.fx{position:absolute;pointer-events:none}
.num{position:absolute;font:900 22px/1 serif;color:#fff3c9;-webkit-text-stroke:1px #5a2b12;animation:up .8s ease-out forwards}
@keyframes up{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-46px);opacity:0}}
#panel{max-width:520px;margin:0 auto;padding:10px 14px}
#panel h1{font-size:16px;margin:0 0 6px;color:#f3dfa0;letter-spacing:.1em}#panel p{font-size:11px;color:#b9aecb;margin:0 0 10px}
.b{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{border:1px solid #d8b25a;border-radius:8px;background:linear-gradient(#3a2957,#22173a);color:#f6ecd0;font:600 14px/1 inherit;padding:12px 0}
</style></head><body>
<div id="stage"><div id="foe"></div></div>
<div id="panel"><h1>勞權律師・白律｜分層動作驗收</h1>
<p>七個獨立部件（頭、身體、持筆右臂、公文包手、袖、雙腿）由骨架驅動。部件取自使用者提供的造型圖，狀態：候選。</p>
<div class="b"><button data-a="walk">走位</button><button data-a="attack">普攻</button><button data-a="block">格擋</button>
<button data-a="dispel">驅散</button><button data-a="hurt">受擊</button><button data-a="victory">勝利</button></div></div>
<script type="module">
import {loadRig,createRigActor,THRUST_ARM} from './rig-actor.mjs?v=3';
const base='../art/characters/office-lawyer/layers/rig/';
const stage=document.getElementById('stage'),foe=document.getElementById('foe');
const rig=await loadRig(base);
const H=()=>stage.clientHeight*.46;
const actor=createRigActor(stage,rig,base,{height:H()});
const place=()=>actor.setPosition(stage.clientWidth*.28,stage.clientHeight*.93);place();addEventListener('resize',place);
function foeHit(n){foe.classList.remove('hurt');void foe.offsetWidth;foe.classList.add('hurt');setTimeout(()=>foe.classList.remove('hurt'),340);
 const d=document.createElement('div');d.className='num';d.textContent=n;const r=foe.getBoundingClientRect(),s=stage.getBoundingClientRect();d.style.left=(r.left-s.left+r.width/2)+'px';d.style.top=(r.top-s.top)+'px';stage.appendChild(d);setTimeout(()=>d.remove(),800);}
// 目標點：敵人身體左側 35%；以出筆姿勢實測筆尖位置計算需要前進的距離
function reach(){const f=foe.getBoundingClientRect(),s=stage.getBoundingClientRect();actor.pose({arm:THRUST_ARM,armX:30,armY:10,torso:12,lean:8});const tip=actor.penTip();actor.pose({});return Math.max(0,(f.left-s.left+f.width*.35)-tip.x);}
const A={walk:()=>actor.play('walk',900),attack:()=>actor.play('attack',{reach:reach(),onHit:()=>foeHit(18+Math.floor(Math.random()*8))}),
 block:()=>{foe.animate([{transform:'none'},{transform:'translateX(-60px)'},{transform:'none'}],{duration:500});return actor.play('block',{onBlock:()=>{}})},
 dispel:()=>actor.play('dispel',{onSeal:()=>foeHit(9)}),hurt:()=>{foe.animate([{transform:'none'},{transform:'translateX(-60px)'},{transform:'none'}],{duration:420});return actor.play('hurt')},victory:()=>actor.play('victory')};
for(const b of document.querySelectorAll('button'))b.onclick=()=>A[b.dataset.a]();
window.__rig={actor,A,reach,THRUST_ARM};
</script></body></html>
