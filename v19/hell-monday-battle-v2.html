;gap:8px}.controls button{flex:1;background:#473048;color:#ffe2b1;border:1px solid #bd865d;border-radius:9px;padding:10px}.note{font-size:11px;color:#b9a8b8;margin:7px 0 0}</style><style>

</style><main><header><b>地獄星期一｜BOSS 戰 V2</b><span>BOSS 戰 · 01</span></header><div class="stage"><div class="battle-flare" aria-hidden="true"></div><div class="boss" aria-label="截止日魔鐘"><img src="../art/v19/runtime/monsters/deadline-clock/idle.webp" alt="截止日魔鐘"><strong>截止日魔鐘</strong></div><div class="impact" id="impact" aria-hidden="true"></div><div class="party" id="party"></div></div><div class="foot"><div class="controls"><button id="swap">調整陣型</button><button id="roster">切換隊伍</button><button id="attack">發動突擊</button></div><p class="note">V2 獨立入口｜角色按陣容動態載入；未完成美術以剪影標記，不預先畫入背景。</p></div></main><script type="module">
const ASSETS={
  hero:{name:'薪奴',src:'../art/v19/candidates/characters/starter/chibi/idle-candidate.webp'},
  guard:{name:'打卡守衛',src:null},fighter:{name:'逃班鬥士',src:null},assassin:{name:'截止日刺客',src:null},
  caster:{name:'試算表法師',src:null},healer:{name:'咖啡醫官',src:null},engineer:{name:'機械工程師',src:null},
  archer:{name:'異界弓手',src:null},alchemist:{name:'鍊金師',src:null},knight:{name:'夜班騎士',src:null}
};
const sets=[['guard','fighter','assassin','caster','healer','engineer'],['knight','archer','fighter','alchemist','caster','healer']];
let roster=0,flip=false;const p=document.querySelector('#party');
function actor(id,index){
 const data=ASSETS[id],b=document.createElement('button');b.type='button';b.className='unit'+(id==='hero'?' hero':'');b.dataset.characterId=id;
 if(id!=='hero'){b.style.left=[0,35,70][index%3]+'%';b.style.top=((index<3)!==flip?'37%':'3%')}
 if(data.src){const img=document.createElement('img');img.src=data.src;img.alt=data.name;img.onerror=()=>{img.remove();const fallback=document.createElement('span');fallback.className='missing';fallback.textContent='素材未載入';b.prepend(fallback)};b.append(img)}
 else {const fallback=document.createElement('span');fallback.className='missing';fallback.textContent='角色美術製作中';b.append(fallback)}
 const label=document.createElement('small');label.textContent=data.name;b.append(label);
 b.onclick=()=>b.classList.toggle('active');return b;
}
function draw(){p.replaceChildren(...sets[roster].map((id,i)=>actor(id,i)),actor('hero',6))}
document.querySelector('#swap').onclick=()=>{flip=!flip;draw()};
document.querySelector('#roster').onclick=()=>{roster=1-roster;draw()};
document.querySelector('#attack').onclick=()=>{const u=p.querySelector('.unit:not(.hero)');if(!u)return;u.animate([{transform:'translateY(0) scale(1)'},{transform:'translate(30px,-150px) scale(1.24)'},{transform:'translateY(0) scale(1)'}],{duration:690,easing:'cubic-bezier(.2,.8,.3,1)'});const impact=document.querySelector('#impact');impact.classList.remove('burst');void impact.offsetWidth;impact.classList.add('burst')};
draw();
</script></html>
