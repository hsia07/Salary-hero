<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>薪水勇者｜直式七人戰場測試</title><style>*{box-sizing:border-box}body{margin:0;background:#100b1d;color:#ffe7c6;font-family:system-ui}main{height:100dvh;max-width:490px;margin:auto;display:flex;flex-direction:column;background:#201527}header{padding:12px 14px 7px;display:flex;justify-content:space-between;align-items:center}header b{color:#ffd18c}.stage{flex:1;min-height:0;position:relative;overflow:hidden;background:linear-gradient(#4b243b66,#210e2b99),url('../art/v19/runtime/backgrounds/storybook-office.svg') center/cover}.stage:before{content:'';position:absolute;inset:0;background:linear-gradient(transparent 52%,#100a20b3)}.boss{position:absolute;top:15%;left:50%;transform:translateX(-50%);font-size:clamp(64px,19vw,108px);filter:drop-shadow(0 8px 14px #000)}.boss:after{content:'';position:absolute;bottom:-9px;left:8%;width:84%;height:8px;background:#bd3e4d;border:2px solid #efb78b;border-radius:9px}.party{position:absolute;left:5%;right:5%;bottom:7%;height:44%}.unit{position:absolute;width:29%;height:28%;border:0;background:transparent;color:#fff;text-shadow:0 2px 4px #000;font-size:clamp(30px,9vw,49px);display:flex;align-items:center;justify-content:center;flex-direction:column;transition:left .22s,top .22s;filter:drop-shadow(0 5px 3px #0008)}.unit small{font-size:10px;background:#221329c9;padding:2px 5px;border-radius:7px}.unit.active{filter:drop-shadow(0 0 8px #f4bf6e)}.unit.hero{width:34%;height:32%;left:33%;top:67%}.foot{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#201428}button{font:inherit;cursor:pointer}.controls{display:flex;gap:8px}.controls button{flex:1;background:#473048;color:#ffe2b1;border:1px solid #bd865d;border-radius:9px;padding:10px}.note{font-size:11px;color:#b9a8b8;margin:7px 0 0}</style><main><header><b>地獄星期一｜站位驗證</b><span>直式 7 人</span></header><div class="stage"><div class="boss" aria-label="示意敵人">👹</div><div class="party" id="party"></div></div><div class="foot"><div class="controls"><button id="swap">交換前後排</button><button id="roster">更換陣容</button><button id="attack">攻擊演出</button></div><p class="note">可操作站位測試：背景與角色分開。表情符號是工程佔位，尚非正式角色美術；本頁不更動遊戲存檔。</p></div></main><script>const sets=[['🛡️','⚔️','🥷','🪄','☕','🤖'],['🧙','🦾','🦊','🏹','🧪','🧝']];let roster=0,flip=false;const p=document.querySelector('#party');function draw(){p.replaceChildren();sets[roster].forEach((u,i)=>{let b=document.createElement('button');b.className='unit';b.style.left=[0,35,70][i%3]+'%';b.style.top=(i<3)!=(flip)?'37%':'3%';b.innerHTML='<span>'+u+'</span><small>同事 '+(i+1)+'</small>';b.onclick=()=>{b.classList.toggle('active')};p.append(b)});let h=document.createElement('div');h.className='unit hero';h.innerHTML='<span>🧑🏻‍💼</span><small>薪奴</small>';p.append(h)}document.querySelector('#swap').onclick=()=>{flip=!flip;draw()};document.querySelector('#roster').onclick=()=>{roster=1-roster;draw()};document.querySelector('#attack').onclick=()=>{let u=p.querySelector('.unit:not(.hero)');if(!u)return;u.animate([{transform:'translateY(0)'},{transform:'translateY(-80px) scale(1.13)'},{transform:'translateY(0)'}],{duration:520,easing:'ease-in-out'})};draw()</script></html>
