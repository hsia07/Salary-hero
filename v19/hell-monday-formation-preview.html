<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>薪水勇者｜直式七人戰場測試</title><style>*{box-sizing:border-box}body{margin:0;background:#100b1d;color:#ffe7c6;font-family:system-ui}main{height:100dvh;max-width:490px;margin:auto;display:flex;flex-direction:column;background:#201527}header{padding:12px 14px 7px;display:flex;justify-content:space-between;align-items:center}header b{color:#ffd18c}.stage{flex:1;min-height:0;position:relative;overflow:hidden;background:linear-gradient(#4b243b66,#210e2b99),url('../art/v19/runtime/backgrounds/storybook-office.svg') center/cover}.stage:before{content:'';position:absolute;inset:0;background:linear-gradient(transparent 52%,#100a20b3)}.boss{position:absolute;top:15%;left:50%;transform:translateX(-50%);font-size:clamp(64px,19vw,108px);filter:drop-shadow(0 8px 14px #000)}.boss:after{content:'';position:absolute;bottom:-9px;left:8%;width:84%;height:8px;background:#bd3e4d;border:2px solid #efb78b;border-radius:9px}.party{position:absolute;left:5%;right:5%;bottom:7%;height:44%}.unit{position:absolute;width:29%;height:28%;border:0;background:transparent;color:#fff;text-shadow:0 2px 4px #000;font-size:clamp(30px,9vw,49px);display:flex;align-items:center;justify-content:center;flex-direction:column;transition:left .22s,top .22s;filter:drop-shadow(0 5px 3px #0008)}.unit img{max-width:95%;max-height:82%;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 5px 4px #0009)}.unit .missing{font-size:10px;line-height:1.3;border:1px dashed #ddae83;background:#241827d9;padding:7px;border-radius:8px;max-width:90%;text-align:center}.unit small{font-size:10px;background:#221329c9;padding:2px 5px;border-radius:7px}.unit.active{filter:drop-shadow(0 0 8px #f4bf6e)}.unit.hero{width:34%;height:32%;left:33%;top:67%}.foot{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#201428}button{font:inherit;cursor:pointer}.controls{display:flex;gap:8px}.controls button{flex:1;background:#473048;color:#ffe2b1;border:1px solid #bd865d;border-radius:9px;padding:10px}.note{font-size:11px;color:#b9a8b8;margin:7px 0 0}</style><main><header><b>地獄星期一｜站位驗證</b><span>直式 7 人</span></header><div class="stage"><div class="boss" aria-label="示意敵人">👹</div><div class="party" id="party"></div></div><div class="foot"><div class="controls"><button id="swap">交換前後排</button><button id="roster">更換陣容</button><button id="attack">攻擊演出</button></div><p class="note">可操作站位測試：角色必須從獨立素材庫動態載入，不得把七人預先畫入背景。主角載入既有獨立圖檔，同事未完成素材時明確顯示缺圖，不用 Emoji 假冒角色。陣容是測試資料，不讀取或更動正式存檔。</p></div></main><script type="module">
const ASSETS={
  hero:{name:'薪奴',src:'../art/v19/candidates/characters/starter/chibi/idle-candidate.webp'},
  guard:{name:'打卡守衛',src:null},fighter:{name:'逃班鬥士',src:null},assassin:{name:'截止日刺客',src:null},
  caster:{name:'試算表法師',src:null},healer:{name:'咖啡醫官',src:null},engineer:{name:'機械工程師',src:null},
  archer:{name:'異界弓手',src:null},alchemist:{name:'鍊金師',src:null},knight:{name:'夜班騎士',src:null}
};
const sets=[['guard','fighter','assassin','caster','healer','engineer'],['knight','archer','fighter','alchemist','caster','healer']];
let roster=0,flip=false;const p=document.querySelector('#party');
function actor(id,index){
 const data=ASSETS[id],b=document.createElement('button');b.type='button';b.className='unit'+(id==='hero'?' hero':'');b.dataset.characterId=id;
 if(id!=='hero'){b.style.left=[0,35,70][index%3]+'%';b.style.top=((index<3)!==flip?'37%':'3%')}
 if(data.src){const img=document.createElement('img');img.src=data.src;img.alt=data.name;img.onerror=()=>{img.remove();const fallback=document.createElement('span');fallback.className='missing';fallback.textContent='素材未載入';b.prepend(fallback)};b.append(img)}
 else {const fallback=document.createElement('span');fallback.className='missing';fallback.textContent='等待獨立角色素材';b.append(fallback)}
 const label=document.createElement('small');label.textContent=data.name;b.append(label);
 b.onclick=()=>b.classList.toggle('active');return b;
}
function draw(){p.replaceChildren(...sets[roster].map((id,i)=>actor(id,i)),actor('hero',6))}
document.querySelector('#swap').onclick=()=>{flip=!flip;draw()};
document.querySelector('#roster').onclick=()=>{roster=1-roster;draw()};
document.querySelector('#attack').onclick=()=>{const u=p.querySelector('.unit:not(.hero)');if(!u)return;u.animate([{transform:'translateY(0)'},{transform:'translateY(-80px) scale(1.13)'},{transform:'translateY(0)'}],{duration:520,easing:'ease-in-out'})};
draw();
</script></html>
