<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#120a1c"><title>薪水勇者｜地獄星期一・文書牛魔 V2 實戰</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#120a1c;color:#ffe9c9;font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif}button{color:inherit;font:inherit;touch-action:manipulation}.game{height:100dvh;max-width:440px;margin:auto;position:relative;isolation:isolate;overflow:hidden;background:#24142b;--safe:env(safe-area-inset-bottom)}.scene{position:absolute;inset:0;background:url('art/s1/hell-monday/approved-background.webp') center/cover no-repeat}.scene:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#0d0614b6 0%,#13081738 23%,#13081705 46%,#16091d7c 78%,#130b19ed 100%)}.redveil{position:absolute;inset:0;z-index:2;opacity:0;background:linear-gradient(#940e1c4d,#3b002d55);pointer-events:none;transition:opacity .5s}.game.enraged .redveil{opacity:1}.game.shake .stage{animation:shake .25s both}.game.ult-shake .stage{animation:shake .13s infinite}.header{position:absolute;z-index:35;top:env(safe-area-inset-top);left:0;right:0;padding:8px 11px 10px;background:linear-gradient(#1e1024ee,#1b0c20ac);border-bottom:1px solid #b66d57}.heading{display:flex;justify-content:space-between;align-items:center;gap:5px}.heading strong{font-size:clamp(14px,4.4vw,19px);text-shadow:0 1px 5px #000}.heading small{font-size:11px;color:#e8c39f}.boss-head{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:clamp(11px,3.2vw,14px);font-weight:850}.boss-head .mark{padding:1px 5px;background:#b92d35;border:1px solid #ffcc8a;border-radius:4px;color:#fff;font-size:10px;margin-right:5px}.track{height:11px;border:1px solid #eab67d;border-radius:8px;background:#1b0b19;overflow:hidden;margin-top:4px}.track .fill{width:100%;height:100%;background:linear-gradient(90deg,#e37b55,#bc1d49);transition:width .2s}.energy-line{display:flex;align-items:center;gap:8px;margin-top:5px}.energy-line span{font-size:10px;color:#a6cfff;white-space:nowrap}.energy-line .track{flex:1;height:7px;margin:0;border-color:#779ee4;background:#081427}.energy-line .fill{background:linear-gradient(90deg,#416ee2,#86e2ff);width:0%}.stage{position:absolute;inset:0;z-index:5;pointer-events:none}.boss-zone{position:absolute;top:17%;left:8%;width:84%;height:34%;z-index:6;display:flex;align-items:center;justify-content:center;transform-origin:50% 80%}.boss-zone img{height:100%;width:100%;object-fit:contain;filter:drop-shadow(0 11px 14px #0b0310bb)}.boss-zone.enrage img{filter:drop-shadow(0 0 14px #e7294faa) drop-shadow(0 10px 12px #08020f)}.boss-zone.hurt img{filter:sepia(.21) saturate(1.22) brightness(1.08) drop-shadow(0 0 13px #c42249)}.boss-zone.charge{animation:boss-charge .45s ease-in}.boss-zone.slam{animation:boss-slam .42s ease-out}.boss-title{position:absolute;left:8%;right:8%;top:48%;font-size:15px;font-weight:950;text-align:center;color:#ffe39e;text-shadow:0 2px 6px #330e19;z-index:22;opacity:0;transition:opacity .15s}.boss-title.show{opacity:1}.team{position:absolute;inset:52% 0 17%;z-index:11}.unit{position:absolute;width:28%;height:28%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;filter:drop-shadow(0 5px 5px #06030b);transition:opacity .2s}.unit img{max-width:100%;height:78%;object-fit:contain;transform-origin:50% 80%}.unit small{font-size:clamp(8px,2.4vw,10px);white-space:nowrap;background:#1e111ecb;border-radius:5px;padding:1px 4px;text-shadow:0 1px 3px #000}.unit .life{height:4px;width:72%;background:#1f241e;border-radius:5px;overflow:hidden;border:1px solid #a6b5a0}.unit .life>i{display:block;height:100%;width:100%;background:#6fe98b;transition:width .35s}.unit.hit img{animation:recoil .36s ease-out;filter:sepia(.6) saturate(2.4) brightness(1.18)}.unit.attack img{animation:hero-lunge .38s ease-out}.unit.down{opacity:.42;filter:grayscale(.8)}.unit .debuff{position:absolute;top:8%;right:6%;font-size:10px;background:#5d205b;border:1px solid #b67bbd;border-radius:4px;padding:0 3px;display:none}.unit.fatigued .debuff{display:block}.fx-layer{position:absolute;inset:0;z-index:23;overflow:hidden;pointer-events:none}.travel{position:absolute;object-fit:contain;pointer-events:none;filter:drop-shadow(0 0 9px #ed4a7a);z-index:2}.impact{position:absolute;width:110px;height:96px;object-fit:contain;pointer-events:none;z-index:3}.warning{position:absolute;border:2px solid #ff6c68;border-radius:50%;box-shadow:0 0 13px #f33, inset 0 0 10px #f33;background:#ff26301b;transform:translate(-50%,-50%);animation:warn .42s ease-in-out infinite alternate;z-index:1}.paper{position:absolute;width:48px;height:48px;object-fit:contain;pointer-events:none}.float-number{position:absolute;z-index:40;font-size:17px;font-weight:950;text-shadow:0 2px #4c1924,0 0 5px #fa6960;white-space:nowrap;pointer-events:none;animation:floating .75s forwards}.float-number.heal{color:#9dffba;text-shadow:0 2px #105c42}.flash{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 69%,#f9865a99,#e21d3740 40%,transparent 75%);z-index:28;pointer-events:none;opacity:0}.flash.on{animation:flash .52s ease-out}.footer{position:absolute;bottom:0;left:0;right:0;z-index:45;padding:5px 9px calc(8px + var(--safe));background:linear-gradient(#241425e9,#110b18f9);border-top:2px solid #c98964}.status{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#ebc49e;margin-bottom:4px}.portraits{display:flex;gap:3px;margin-bottom:5px}.portrait{flex:1;min-width:0;aspect-ratio:1.1;background:#2c182b;border:1px solid #956a60;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.portrait img{width:100%;height:100%;object-fit:contain}.portrait .bar{position:absolute;left:4%;right:4%;bottom:2px;height:3px;background:#69ec93}.buttons{display:flex;gap:6px}.buttons button{flex:1;min-height:39px;border:1px solid #d7a177;border-radius:9px;background:linear-gradient(#6f3d50,#3b2639);font-size:12px;font-weight:850}.buttons button.primary{background:linear-gradient(#e6a052,#9d3e42)}.note{font-size:9px;color:#d1b3aa;margin-top:5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.end-screen{position:absolute;inset:0;z-index:70;background:#120a1ce8;display:none;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:24px;text-align:center}.end-screen.show{display:flex}.end-screen h2{font-size:28px;color:#ffe3ae}.end-screen button{border:1px solid #e7ba80;background:#963d48;padding:14px 26px;border-radius:9px;font-weight:800}.game.paused *, .game.paused *:before,.game.paused *:after{animation-play-state:paused!important}.game.paused .flash{animation-play-state:paused!important}@keyframes recoil{25%{transform:translateY(-6px) translateX(-8px) rotate(-12deg)}65%{transform:translateY(7px) translateX(6px) rotate(8deg)}}@keyframes hero-lunge{40%{transform:translateY(-18px) translateX(8px) rotate(-9deg)}}@keyframes boss-charge{50%{transform:translateY(-15px) scale(1.05)}}@keyframes boss-slam{40%{transform:translateY(20px) scale(1.09)}}@keyframes warn{to{opacity:.55;box-shadow:0 0 24px #ff5c6c,inset 0 0 18px #ed3348}}@keyframes floating{0%{opacity:0;transform:translateY(12px) scale(.75)}24%{opacity:1;transform:translateY(-9px) scale(1.13)}100%{opacity:0;transform:translateY(-54px)}}@keyframes flash{20%{opacity:.85}100%{opacity:0}}@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-5px,2px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,3px)}}@media(max-height:700px){.header{padding-top:4px}.boss-zone{top:18%;height:29%}.team{inset:50% 0 16%}.footer{padding-top:3px}.portrait{aspect-ratio:1.35}.note{display:none}}
</style></head><body><main id="game" class="game"><div class="scene"></div><div class="redveil"></div><div id="stage" class="stage"><div id="boss" class="boss-zone"><img id="bossImg" alt="文書牛魔獨立動畫"></div><div id="bossTitle" class="boss-title"></div><section id="team" class="team"></section><div id="fx" class="fx-layer"></div><div id="flash" class="flash"></div></div><header class="header"><div class="heading"><strong>地獄星期一 · 魔王戰</strong><small id="phase">第 4/4 波</small></div><div class="boss-head"><span><span class="mark">BOSS</span>加班狂課長・文書牛魔</span><span id="bossPercent">100%</span></div><div class="track"><div id="bossHP" class="fill"></div></div><div class="energy-line"><span>怒氣 <b id="energyText">0%</b></span><div class="track"><div id="energy" class="fill"></div></div></div></header><footer class="footer"><div class="status"><span id="status">進場即自動戰鬥 · 目標碰撞測試</span><span id="speedLabel">×1</span></div><div id="portraits" class="portraits"></div><div class="buttons"><button id="speedBtn">倍速 ×1</button><button id="pauseBtn">暫停</button><button id="restartBtn" class="primary">重新挑戰</button></div><div class="note">素材為 Boss V1 分幀／透明部件；同事仍為暫用獨立素材</div></footer><section id="end" class="end-screen"><h2 id="endTitle"></h2><p id="endSummary"></p><button id="again">再次挑戰</button></section></main><script src="boss-v2-engine.js"></script></body></html>
