name: V19 Real Adventure Encounters Mobile QA
on:
  push:
    branches: [main]
    paths:
      - 'v19/engine.mjs'
      - 'v19/portrait-home.mjs'
      - 'v19/portrait-home.css'
      - 'v19/portrait-one-screen.css'
      - 'v19/storybook-skin.css'
      - 'art/v19/runtime/backgrounds/storybook-*.svg'
      - 'art/v19/runtime/ui/storybook-icons.svg'
      - 'scripts/qa-v19-chibi-browser.py'
      - 'v19/portrait-home.test.mjs'
      - 'art/v19/runtime/portrait/**'
      - 'scripts/qa-v19-portrait-home-mobile.py'
      - 'v19/engine.test.mjs'
      - 'v19/app.mjs'
      - 'v19/play.html'
      - 'scripts/qa-v19-encounters-mobile.py'
      - 'scripts/qa-v19-lite-armory-mobile.py'
      - 'v19/lite-equipment.mjs'
      - 'v19/lite-builds.mjs'
      - 'v19/lite-skills.mjs'
      - 'v19/lite-presets.mjs'
      - 'v19/lite-legendaries.mjs'
      - 'v19/lite-tactics.mjs'
      - 'v19/lite-tactics.test.mjs'
      - 'v19/lite-armor-poses.mjs'
      - 'art/v19/runtime/hero/lite-*.svg'
      - 'v19/lite-builds.test.mjs'
      - 'art/v19/runtime/weapons/lite-*.svg'
      - '.github/workflows/v19-encounters-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-encounter-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test encounter rewards, save safety, and gameplay rules
        run: |
          node --check v19/engine.mjs
          node --check v19/app.mjs
          node --test v19/engine.test.mjs
      - name: Install real mobile-browser simulation
        run: |
          python -m pip install --disable-pip-version-check "playwright>=1.56,<2"
          python -m playwright install --with-deps chromium
      - name: Serve production game
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory . > /tmp/encounter-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8766/v19/play.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Real 390px portrait RPG homepage + live UI QA
        run: python scripts/qa-v19-portrait-home-mobile.py
      - name: Real 390px Chromium adventure interaction QA
        run: python scripts/qa-v19-encounters-mobile.py
      - name: Real 390px Chromium Lite equipment and save QA
        run: python scripts/qa-v19-lite-armory-mobile.py
      - name: Save encounter scene screenshot for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v19-adventure-storybook-mobile
          path: |
            art/v19/runtime/qa/encounter-storybook-mobile.png
            art/v19/runtime/qa/lite-armory-mobile.png
            art/v19/runtime/qa/lite-build-clockout-mobile.png
            art/v19/runtime/qa/lite-equipped-armor-mobile.png
            art/v19/runtime/qa/lite-equipped-armor-attack-mobile.png
            art/v19/runtime/qa/portrait-home-390-mobile.png
            art/v19/runtime/qa/portrait-one-screen-390x844.png
            art/v19/runtime/qa/portrait-one-screen-375x667.png
            art/v19/runtime/qa/portrait-one-screen-320x568.png
            art/v19/runtime/qa/portrait-home-full-scroll.png
          if-no-files-found: warn
