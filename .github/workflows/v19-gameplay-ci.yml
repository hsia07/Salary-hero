name: V19 Gameplay and Cosmetic Regression Tests
on:
  push:
    branches: [main]
    paths:
      - "v19/engine.mjs"
      - "v19/lite-equipment.mjs"
      - "v19/lite-idle.mjs"
      - "v19/lite-builds.mjs"
      - "v19/lite-skills.mjs"
      - "v19/lite-presets.mjs"
      - "v19/lite-legendaries.mjs"
      - "v19/lite-deep.test.mjs"
      - "v19/lite-tactics.mjs"
      - "v19/lite-tactics.test.mjs"
      - "v19/lite-armor-poses.mjs"
      - "v19/lite-builds.test.mjs"
      - "v19/lite-idle.test.mjs"
      - "v19/lite-equipment.test.mjs"
      - "v19/roster.mjs"
      - "v19/skins.mjs"
      - "v19/skin-ui.mjs"
      - "v19/app.mjs"
      - "v19/monster-motion.mjs"
      - "v19/monster-motion.test.mjs"
      - "v19/sprite-atlas.mjs"
      - "v19/sprite-atlas.test.mjs"
      - "v19/paper-art.test.mjs"
      - "v19/paper-combat.mjs"
      - "v19/coffee-combat.mjs"
      - "v19/coffee-combat.test.mjs"
      - "v19/guard-combat.mjs"
      - "v19/guard-candidate.test.mjs"
      - "v19/guard-trial.html"
      - "art/v19/candidates/monsters/chair-golem/**"
      - "v19/training-mode.mjs"
      - "v19/training-mode.test.mjs"
      - "v19/combat-feedback.mjs"
      - "v19/combat-feedback.test.mjs"
      - "v19/coffee-trial.html"
      - "v19/paper-combat.test.mjs"
      - "v19/coffee-candidate.test.mjs"
      - "v19/cup-trial.html"
      - "art/v19/candidates/monsters/coffee-mimic/**"
      - "v19/paper-trial.html"
      - "art/v19/runtime/monsters/**"
      - "v19/monster-gallery.html"
      - "v19/attack-timing.mjs"
      - "v19/hurt-timing.mjs"
      - "v19/hurt-effects.mjs"
      - "v19/hurt-effects.test.mjs"
      - "v19/hurt-timing.test.mjs"
      - "v19/attack-timing.test.mjs"
      - "v19/play.html"
      - "v19/engine.test.mjs"
      - "v19/weekly-dungeons.test.mjs"
      - "v19/weekend-chaos.test.mjs"
      - "v19/playable-modes.test.mjs"
      - "v19/weekend-chaos.mjs"
      - "v19/skins.test.mjs"
      - ".github/workflows/v19-gameplay-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check of dynamic game modules
        run: |
          node --check v19/engine.mjs
          node --check v19/lite-equipment.mjs
          node --check v19/lite-idle.mjs
          node --check v19/lite-builds.mjs
          node --check v19/lite-skills.mjs
          node --check v19/lite-presets.mjs
          node --check v19/lite-legendaries.mjs
          node --check v19/lite-tactics.mjs
          node --check v19/lite-armor-poses.mjs
          node --check v19/weekend-chaos.mjs
          node --check v19/roster.mjs
          node --check v19/skins.mjs
          node --check v19/skin-ui.mjs
          node --check v19/app.mjs
          node --check v19/monster-motion.mjs
          node --check v19/sprite-atlas.mjs
          node --check v19/paper-combat.mjs
          node --check v19/coffee-combat.mjs
          node --check v19/guard-combat.mjs
          node --check v19/training-mode.mjs
          node --check v19/combat-feedback.mjs
          node --check v19/attack-timing.mjs
          node --check v19/hurt-timing.mjs
          node --check v19/hurt-effects.mjs
      - name: Run all engine and cosmetics rules tests
        run: node --test v19/lite-tactics.test.mjs v19/lite-deep.test.mjs v19/lite-builds.test.mjs v19/lite-idle.test.mjs v19/lite-equipment.test.mjs v19/guard-candidate.test.mjs v19/combat-feedback.test.mjs v19/training-mode.test.mjs v19/coffee-combat.test.mjs v19/coffee-candidate.test.mjs v19/paper-combat.test.mjs v19/paper-art.test.mjs v19/sprite-atlas.test.mjs v19/monster-motion.test.mjs v19/engine.test.mjs v19/weekly-dungeons.test.mjs v19/weekend-chaos.test.mjs v19/playable-modes.test.mjs v19/skins.test.mjs v19/attack-timing.test.mjs v19/hurt-timing.test.mjs v19/hurt-effects.test.mjs
