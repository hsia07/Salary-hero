name: Import staged V18 artwork
on:
  push:
    branches: [main]
    paths:
      - 'art/v18/staging/**'
      - 'tools/v18-import-art-bundle.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v18-art-import-main
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and import staged WebP files
        run: node tools/v18-import-art-bundle.mjs
      - name: Commit verified artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/v18/runtime/
          if git diff --cached --quiet; then
            echo "No artwork changes"
          else
            git commit -m "V18: import integrity-checked staged art"
            git push origin HEAD:main
          fi
