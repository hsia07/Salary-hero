name: V19 Layered Art and Mobile Rendering QA
on:
  push:
    branches: [main]
    paths:
      - 'art/v19/runtime/**'
      - 'art/v19/candidates/characters/starter/**'
      - 'v19/chibi-attack-preview.html'
      - 'v19/chibi-art-preview.html'
      - 'v19/app.mjs'
      - 'v19/portrait-home.mjs'
      - 'v19/portrait-home.css'
      - 'v19/play.html'
      - 'scripts/qa-v19-layered-art.py'
      - 'scripts/qa-v19-chibi-candidate.py'
      - 'scripts/qa-v19-chibi-attack.py'
      - 'scripts/qa-v19-hd-battle-art.py'
      - 'scripts/qa-v19-chibi-browser.py'
      - 'scripts/qa-v19-mobile-smoke.py'
      - '.github/workflows/v19-art-runtime-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-art-and-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install raster and browser validation tools
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=12,<13" "CairoSVG>=2.7,<3" "numpy>=2,<3" "playwright>=1.56,<2"
          python -m playwright install --with-deps chromium
      - name: Verify JavaScript modules can parse
        run: |
          node --check v19/app.mjs
          node --check v19/engine.mjs
          node --check v19/roster.mjs
          node --check v19/skins.mjs
      - name: Validate real pixel size, alpha and independent art layers
        run: python scripts/qa-v19-layered-art.py
      - name: Verify Q-version starter standalone sprite dimensions and alpha
        run: python scripts/qa-v19-chibi-candidate.py
      - name: Verify real five-pose art strip dimensions, alpha and limb differences
        run: python scripts/qa-v19-chibi-attack.py
      - name: Verify the actual committed HD attack/hurt binary files and all frame margins
        run: python scripts/qa-v19-hd-battle-art.py
      - name: Start local build for browser smoke check
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory . > /tmp/salary-hero-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8766/v19/play.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Test in narrow mobile viewport and capture screenshots
        run: python scripts/qa-v19-mobile-smoke.py
      - name: Test Q-version attack in Chromium on a mobile viewport
        run: python scripts/qa-v19-chibi-browser.py
      - name: Upload actual technical QA outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v19-art-qa-and-mobile-screens
          path: art/v19/runtime/qa/
          if-no-files-found: warn
