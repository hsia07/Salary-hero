name: Salary Hero Boss V3 Browser Acceptance

on:
  push:
    branches: [main]
    paths:
      - "boss-v3-play.html"
      - "boss-v3-cannon-runtime.js"
      - "boss-v3-cannon.css"
      - "art/skills/hell-monday/**"
      - "tests/boss-v3-cannon-browser.mjs"
      - ".github/workflows/boss-v3-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-boss-ultimate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install lightweight browser driver
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Verify asset and script syntax
        run: |
          node --check boss-v3-cannon-runtime.js
          node --check tests/boss-v3-cannon-browser.mjs
          test -s art/skills/hell-monday/overtime-cannon.svg
          test -s boss-v1-play.html
      - name: Render and verify the cannon on mobile viewport
        run: CHROME_BIN=/usr/bin/google-chrome node tests/boss-v3-cannon-browser.mjs
      - name: Upload rendered battle screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-v3-cannon-mobile-smoke
          path: artifacts/
          if-no-files-found: ignore
