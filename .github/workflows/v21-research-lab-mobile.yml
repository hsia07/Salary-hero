name: V21 Tactical Research Lab Mobile QA
on:
  push:
    branches: [main]
    paths:
      - "v19/v21-research-lab.mjs"
      - "v19/v21-research-lab.css"
      - "v19/v21-research-lab.test.mjs"
      - "v19/v21-build-lab.mjs"
      - "v19/v21-squad-core.mjs"
      - "v19/play.html"
      - "v19/app.mjs"
      - "scripts/qa-v21-research-mobile.py"
      - ".github/workflows/v21-research-lab-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check lab syntax and pure behavior
        run: |
          node --check v19/v21-research-lab.mjs
          node --test v19/v21-research-lab.test.mjs v19/v21-build-lab.test.mjs
      - name: Install phone browser
        run: |
          python -m pip install --disable-pip-version-check "playwright>=1.56,<2"
          python -m playwright install --with-deps chromium
      - name: Serve actual game
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory . > /tmp/v21-research.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8766/v19/play.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Real 390 and 320 pixel tactical laboratory interaction
        run: python scripts/qa-v21-research-mobile.py
      - name: Upload interactive mobile laboratory screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v21-research-lab-mobile-screens
          path: |
            art/v19/runtime/qa/v21-research-lab-390-mobile.png
            art/v19/runtime/qa/v21-research-lab-320-mobile.png
          if-no-files-found: warn
