name: V19 hero asset render and strict QA

on:
  push:
    branches: [main]
    paths:
      - "art/v19/candidates/hero/*.svg"
      - "scripts/build-v19-hero-assets.py"
      - "v19/app.mjs"
      - "v19/engine.mjs"
      - "v19/engine.test.mjs"
      - ".github/workflows/v19-render-hero-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v19-hero-assets-main
  cancel-in-progress: false

jobs:
  render-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install raster and alpha validation dependencies
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<13" "CairoSVG>=2.7,<3"
      - name: Check JavaScript syntax and actual gameplay state transitions
        run: |
          node --check v19/app.mjs
          node --check v19/engine.mjs
          node --test v19/engine.test.mjs
      - name: Render 5 independent sprites and reject invalid sizes, alpha or clipping
        run: python scripts/build-v19-hero-assets.py
      - name: Commit only validated candidate sprites and technical report
        run: |
          git add art/v19/candidates/hero-webp/*.webp docs/V19_HERO_ASSET_QA.json
          if git diff --cached --quiet; then
            echo "All rendered sprite outputs match the existing files."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "art(v19): build and audit transparent 512px hero WebP candidates"
          git push origin HEAD:main
