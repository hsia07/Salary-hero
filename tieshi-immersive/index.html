<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0812"><title>鐵時｜沉浸式 SR 試玩</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08070e;color:#fff;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;color:inherit;cursor:pointer}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 12px;background:radial-gradient(ellipse at 50% 35%,#32223e,#08070e 72%)}h1{font-size:19px;margin:0 0 8px;color:#ffdfa3}p{margin:0 0 20px;color:#bfb0cc;font-size:12px;text-align:center}.deck{width:min(100%,520px);display:flex;gap:12px;justify-content:center}.card{width:46%;max-width:215px;aspect-ratio:.72;position:relative;overflow:hidden;border-radius:14px;border:2px solid #d6af68;background:linear-gradient(155deg,#3c294a,#120f20);box-shadow:0 16px 40px #000b;padding:0}.card::before{content:"";position:absolute;inset:5px;border:1px solid #f7dba98c;border-radius:10px;pointer-events:none;z-index:3}.art{position:absolute;inset:0;background:linear-gradient(155deg,#58305d,#21172f 48%,#bd602b);overflow:hidden}.art .figure{position:absolute;left:15%;top:17%;width:70%;height:70%;filter:drop-shadow(0 8px 12px #0008)}.art .head{position:absolute;left:30%;top:7%;width:43%;height:29%;border-radius:42% 45% 40% 45%;background:#d8b29f;box-shadow:inset -8px -4px #a26c6a}.art .hair{position:absolute;left:26%;top:0;width:52%;height:19%;background:#1b1727;clip-path:polygon(8% 30%,28% 0,42% 20%,64% 0,85% 20%,100% 76%,72% 64%,40% 96%,0 68%)}.art .body{position:absolute;left:15%;top:32%;width:76%;height:62%;background:linear-gradient(110deg,#211b37 15%,#eee1d1 35%,#55506b 58%,#211a32 75%);clip-path:polygon(29% 0,66% 0,100% 100%,0 100%)}.art .shield{position:absolute;left:5%;top:48%;width:66%;height:47%;border:8px solid #b59b66;border-radius:20px 20px 40% 40%;background:linear-gradient(125deg,#322a57,#151427 70%);box-shadow:inset 0 0 0 4px #786b94,0 0 20px #a480b8}.art .digital{position:absolute;top:33%;left:14%;right:14%;height:28%;display:grid;place-items:center;background:#080c19;border:3px solid #9c8a6a;border-radius:6px;color:#c3a7ff;text-shadow:0 0 8px #ae8fff;font:800 clamp(13px,4vw,22px) ui-monospace,monospace}.awakened .art{background:radial-gradient(circle at 62% 24%,#ffca78,#9b412d 40%,#251126 78%)}.awakened .digital{color:#ffdb8c;text-shadow:0 0 9px #ffb74d}.card .top{position:absolute;z-index:4;left:9px;right:9px;top:10px;display:flex;justify-content:space-between;align-items:center;text-shadow:0 2px 4px #000}.top b{background:#d5b46c;color:#20182a;border-radius:5px;padding:2px 5px;font-size:12px}.top strong{font-size:15px}.bottom{position:absolute;z-index:4;bottom:8px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;text-shadow:0 2px 5px #000}.hint{margin-top:18px;color:#ddc4aa;font-size:12px;text-align:center}.stage{position:fixed;inset:0;display:none;background:#090714;overflow:hidden}.stage.active{display:block}.world{position:absolute;inset:-10%;background:radial-gradient(circle at 55% 65%,#e9884a,#762b32 35%,#1b1326 70%);transform:scale(1)}.active .world{animation:push 11s ease-in-out both}.door{position:absolute;left:26%;top:8%;width:48%;height:79%;border:16px solid #242231;background:linear-gradient(95deg,#100f1b,#442a32 50%,#100f1b);box-shadow:0 0 90px #ff793b}.door:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 36px,#191726 37px 45px)}.hero{position:absolute;left:12%;top:25%;width:80%;height:80%;transform:translateY(20px) scale(.88);filter:drop-shadow(0 10px 25px #000)}.hero .head{position:absolute;left:37%;top:0;width:30%;height:21%;background:#c89c8b;border-radius:42%;box-shadow:inset -10px -4px #8b5257}.hero .hair{position:absolute;left:34%;top:-3%;width:35%;height:12%;background:#181525;clip-path:polygon(0 35%,23% 0,40% 30%,65% 0,100% 25%,100% 90%,35% 80%)}.hero .torso{position:absolute;left:26%;top:19%;width:53%;height:56%;background:linear-gradient(100deg,#251e39 10%,#e4d3c3 32%,#393149 67%,#1a162c 88%);clip-path:polygon(23% 0,72% 0,100% 100%,0 100%)}.hero .shield{position:absolute;left:0;top:29%;width:55%;height:54%;border:12px solid #b9a16f;border-radius:24px 24px 40% 40%;background:#282444;box-shadow:inset 0 0 0 5px #65587f,0 0 25px #edaf67}.hero .digital{position:absolute;left:9%;right:9%;top:34%;height:24%;background:#0b101d;border:4px solid #b29b77;border-radius:6px;display:grid;place-items:center;font:800 clamp(23px,9vw,48px) monospace;color:#ffd98b;text-shadow:0 0 15px #e9ac4d}.hand{position:absolute;left:60%;top:39%;width:39%;height:13%;background:#c99b8d;border-radius:45%;transform:rotate(-12deg);transform-origin:left center}.active .hand{animation:reach 11s ease-out both}.smoke{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 90%,#e9ad6c55,transparent 55%),radial-gradient(ellipse at 90% 0%,#201c2cbb,transparent 55%);animation:pulse 2s alternate infinite}.story{position:absolute;bottom:13%;left:20px;right:20px;text-align:center;font-size:20px;font-weight:800;text-shadow:0 3px 12px #000}.close{position:absolute;top:max(14px,env(safe-area-inset-top));right:15px;border:1px solid #b6a17a;border-radius:24px;background:#191321e8;padding:10px 16px;z-index:5}.bar{position:absolute;bottom:0;left:0;height:4px;background:#ffdc9b;width:0}.active .bar{animation:fill 11s linear both}.notice{position:absolute;top:15%;left:12px;right:12px;text-align:center;color:#ffe6b8;font-size:12px;opacity:.8}@keyframes push{0%{transform:scale(1);filter:brightness(.45)}30%{transform:scale(1.22) translateX(-3%)}65%{transform:scale(1.52) translateX(5%);filter:brightness(.75)}100%{transform:scale(1.13);filter:brightness(1.2)}}@keyframes reach{0%,45%{transform:rotate(-12deg) scaleX(.75)}70%,100%{transform:rotate(-8deg) scaleX(1.25)}}@keyframes pulse{to{opacity:.4}}@keyframes fill{to{width:100%}}@media(prefers-reduced-motion:reduce){.active .world,.active .hand,.active .bar{animation:none}}
</style></head><body><main><h1>鐵時｜沉浸式 SR 卡牌</h1><p>手機 Safari 互動測試・非正式美術</p><div class="deck"><button class="card original" id="original" aria-label="原始 SR"><div class="art"><div class="figure"><div class="body"></div><div class="head"></div><div class="hair"></div></div><div class="shield"><div class="digital">08:59</div></div></div><div class="top"><b>SR</b><strong>鐵時</strong></div><div class="bottom">終夜打卡守衛</div></button><button class="card awakened" id="awakened" aria-label="覺醒 SR，播放沉浸式動畫"><div class="art"><div class="figure"><div class="body"></div><div class="head"></div><div class="hair"></div></div><div class="shield"><div class="digital">09:00</div></div></div><div class="top"><b>SR</b><strong>鐵時</strong></div><div class="bottom">最後一道門</div></button></div><div class="hint">點擊右側覺醒卡，進入沉浸式演出</div></main><section class="stage" id="stage" aria-label="沉浸式故事演出"><div class="world"><div class="door"></div><div class="hero"><div class="torso"></div><div class="head"></div><div class="hair"></div><div class="shield"><div class="digital">09:00</div></div><div class="hand"></div></div><div class="smoke"></div></div><div class="notice">鏡頭與互動驗證版｜正式分層美術待製作</div><div class="story" id="story" aria-live="polite"></div><button class="close" id="close">✕ 離開</button><div class="bar"></div></section><script>
(()=>{'use strict';const stage=document.getElementById('stage'),story=document.getElementById('story');let timers=[];function stop(){timers.forEach(clearTimeout);timers=[];stage.classList.remove('active');stage.style.display='none'}function play(){stop();stage.style.display='block';void stage.offsetWidth;stage.classList.add('active');story.textContent='那扇門……還是鎖著。';timers.push(setTimeout(()=>story.textContent='這次，誰也不能留下。',3900),setTimeout(()=>story.textContent='我們一起下班。',7200),setTimeout(stop,11000))}document.getElementById('awakened').addEventListener('click',play);document.getElementById('original').addEventListener('click',()=>alert('原始 SR：盾牌中央電子鐘停在 08:59。'));document.getElementById('close').addEventListener('click',stop);document.addEventListener('keydown',e=>{if(e.key==='Escape')stop()});})();
</script></body></html>
