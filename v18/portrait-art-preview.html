<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>薪水勇者 V18 · 直式首頁美術驗收</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0d0b18;color:#fff0d4;font:14px system-ui}main{max-width:480px;margin:auto;min-height:100dvh;background:#171125}.screen{position:relative;width:100%;aspect-ratio:2/3;overflow:hidden}.screen>img{width:100%;height:100%;display:block}.hot{position:absolute;border:0;background:transparent;cursor:pointer;touch-action:manipulation}.hot:focus-visible{outline:3px solid #fff4a1;background:#ffffff22}.hot:active{background:#fff6a022}.salary{position:absolute;top:20.4%;right:4.8%;width:20%;text-align:center;color:#332014;font-size:clamp(9px,2.5vw,13px);font-weight:900;text-shadow:0 1px #fff6c6;pointer-events:none}.salary strong{display:block;color:#4a2415;font-size:clamp(11px,3vw,16px)}.clock{position:absolute;top:24%;left:6%;width:18%;text-align:center;color:#d5ffe1;font-weight:bold;font-size:clamp(12px,3.2vw,17px);pointer-events:none;text-shadow:0 2px 2px #000}.toolbar{display:flex;justify-content:space-between;gap:8px;padding:12px;background:#1b1427}.toolbar button{flex:1;border:1px solid #c8954d;background:#543449;color:#ffe6b4;border-radius:10px;padding:10px 5px}.note{padding:10px 13px 20px;color:#cab6c7;line-height:1.65;font-size:12px}.note strong{color:#ffe1a2}dialog{background:#21162d;color:#ffe6c1;border:2px solid #c8954d;border-radius:14px;max-width:min(92vw,410px);line-height:1.6}dialog::backdrop{background:#000a}dialog button{padding:10px;border:1px solid #d6a85b;border-radius:9px;background:#593b4c;color:#fff;width:100%}input{width:100%;padding:10px;border-radius:8px;margin-bottom:10px}</style></head><body><main><div class="screen"><img src="../art/v18/portrait-home-master.webp" alt="薪水勇者直式首頁：上方社畜辦公室與即時薪資，中間奇幻自動戰鬥，下方八格遊戲選單"><div class="salary">即時薪資<strong id="earned">NT$0.00</strong></div><div class="clock" id="clock">00:00</div><button class="hot" style="left:1%;top:44%;width:16%;height:13%" data-action="auto" aria-label="切換自動戰鬥"></button><button class="hot" style="left:1%;top:56%;width:16%;height:9%" data-action="speed" aria-label="切換戰鬥速度"></button><button class="hot" style="left:79%;top:40%;width:20%;height:27%" data-action="loot" aria-label="查看戰利品"></button><button class="hot" style="left:2%;top:84%;width:12%;height:13%" data-action="首頁" aria-label="首頁"></button><button class="hot" style="left:14%;top:84%;width:12%;height:13%" data-action="角色" aria-label="角色"></button><button class="hot" style="left:26%;top:84%;width:12%;height:13%" data-action="冒險" aria-label="冒險"></button><button class="hot" style="left:38%;top:84%;width:12%;height:13%" data-action="裝備" aria-label="裝備"></button><button class="hot" style="left:50%;top:84%;width:12%;height:13%" data-action="鍛造" aria-label="鍛造"></button><button class="hot" style="left:62%;top:84%;width:12%;height:13%" data-action="寵物" aria-label="寵物"></button><button class="hot" style="left:74%;top:84%;width:12%;height:13%" data-action="公會" aria-label="公會"></button><button class="hot" style="left:86%;top:84%;width:13%;height:13%" data-action="商店" aria-label="商店"></button></div><div class="toolbar"><button id="hourly">設定時薪</button><button id="pause">暫停計時</button><button id="battle">開啟戰鬥工程版</button></div><div class="note"><strong>V18 直式首頁美術驗收版</strong>：此頁以完整美術圖確認手機視覺與比例，薪資數字可即時計算，按鈕有回應；畫面中的戰鬥人物、怪物、掉寶及其他數值仍是美術圖內容，尚非獨立動畫。下一階段須拆分場景圖層與真正的戰鬥 UI。V17 未更動。</div></main><dialog id="dialog"><h3 id="title"></h3><div id="body"></div><button id="close">關閉</button></dialog><script>const $=s=>document.querySelector(s),dlg=$('#dialog');let rate=Number(localStorage.getItem('salary-hourly-v18')||190),start=Date.now(),elapsed=0,paused=false,auto=true,speed=1;function show(t,s){$('#title').textContent=t;$('#body').textContent=s;dlg.showModal()}$('#close').onclick=()=>dlg.close();function tick(){if(!paused)elapsed=Date.now()-start;let sec=Math.floor(elapsed/1000);$('#clock').textContent=String(Math.floor(sec/3600)).padStart(2,'0')+':'+String(Math.floor(sec/60)%60).padStart(2,'0');$('#earned').textContent='NT$'+(elapsed/3600000*rate).toFixed(2)}setInterval(tick,250);tick();$('#hourly').onclick=()=>{show('設定實際時薪','');$('#body').innerHTML='<p>預設 NT$190／小時；計時從開啟此頁開始，不代表真實出勤。</p><input id="rate" type="number" min="1" max="100000" value="'+rate+'"><button id="save">儲存</button>';$('#save').onclick=()=>{let n=Number($('#rate').value);if(n>0&&n<=100000){rate=n;localStorage.setItem('salary-hourly-v18',String(n));dlg.close()}}};$('#pause').onclick=()=>{paused=!paused;if(!paused)start=Date.now()-elapsed;$('#pause').textContent=paused?'恢復計時':'暫停計時'};$('#battle').onclick=()=>location.href='./portrait-home.html';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{let x=b.dataset.action;if(x==='auto'){auto=!auto;show('自動戰鬥',auto?'已選擇開啟；本美術驗收頁的戰鬥畫面仍為靜態。':'已選擇關閉；本美術驗收頁的戰鬥畫面仍為靜態。')}else if(x==='speed'){speed=speed===1?2:1;show('戰鬥速度','已選擇 ×'+speed+'；本美術驗收頁沒有真正的戰鬥迴圈。')}else show(x,x==='loot'?'戰利品面板尚待接入 V18 真實戰鬥資料。':x+'功能尚未接入正式遊戲。')})</script></body></html>
