<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>薪水勇者 V18.7 戰鬥引擎測試</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#110e1e;color:#f9e9c7;font:15px system-ui,-apple-system,sans-serif}.page{max-width:550px;margin:auto;padding:20px 16px}h1{font-size:23px;margin:8px 0}.note{color:#b9b0c9;line-height:1.65;font-size:13px}.panel{border:1px solid #a57a43;background:#211a30;border-radius:16px;padding:16px;margin:14px 0}.arena{height:220px;border:1px solid #5e5276;border-radius:12px;display:grid;place-items:center;background:linear-gradient(180deg,#25213c,#111423);text-align:center}.arena strong{font-size:18px}.arena p{font-size:13px;color:#c4b8d6}.unit{margin:14px 0}.bar{height:12px;border-radius:12px;background:#453c4c;overflow:hidden;margin:8px 0}.fill{height:100%;width:100%;background:linear-gradient(90deg,#c45565,#f4b779);transition:width .18s}button{border:1px solid #d7a45b;background:#513454;color:#fff;border-radius:10px;padding:12px 16px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #8de5ff}.actions{display:flex;gap:10px;flex-wrap:wrap}#log{min-height:70px;line-height:1.8;font-size:13px;color:#cbd0e3}a{color:#f4c77d}.stat{display:flex;justify-content:space-between;gap:8px}.hit{color:#ffb6a4;font-weight:bold}button[aria-pressed=true]{background:#22554d}.safe{color:#a5e8bc}</style></head>
<body><main class="page"><h1>薪水勇者 · V18.7</h1><p class="note">獨立戰鬥邏輯驗收頁。這裡刻意<strong>不載入</strong>包含靜態人物的 home-master.webp；場景是工程佔位，尚非正式美術。</p>
<section class="panel"><div class="stat"><span>第 <b id="wave">1</b> 波</span><span>金幣 <b id="gold">0</b> · 擊敗 <b id="kills">0</b></span></div><div class="arena" id="arena"><div><strong>等待獨立場景與角色素材</strong><p>沒有預先畫好的勇者、怪物或劍光</p><p id="event" aria-live="polite">戰鬥引擎啟動中</p></div></div><div class="unit">勇者 HP <span id="heroText"></span><div class="bar"><div class="fill" id="heroBar" style="background:linear-gradient(90deg,#4a9d8e,#9ff0cb)"></div></div></div><div class="unit"><span id="enemyName">加班印表機</span> HP <span id="enemyText"></span><div class="bar"><div class="fill" id="enemyBar"></div></div></div></section>
<section class="panel"><div class="actions"><button id="toggle">停止自動戰鬥</button><button id="speed">速度 ×1</button><button id="step">手動測試一次</button></div><p class="note">停止後不會自動攻擊或扣血；手動測試不受自動開關影響。</p><div class="actions" style="margin-top:12px"><button data-equip="starter">初始劍</button><button data-equip="iron">鐵劍</button><button data-equip="gold">黃金劍</button></div><p class="note" id="gear">裝備：初始劍 · 攻擊 12</p><div id="log" aria-live="polite"></div></section><p class="note"><a href="../v18-art-test.html?v=18.5">返回 V18 美術參考頁</a> · <a href="../?v=17.1">返回 V17 正式遊戲</a></p></main>
<script type="module">import {BattleState} from './battle-state.mjs';
const $=id=>document.getElementById(id);let lastLog='';
const game=new BattleState({onChange:s=>{ $('wave').textContent=s.wave;$('gold').textContent=s.gold;$('kills').textContent=s.kills;$('heroText').textContent=s.hero.hp+'/'+s.hero.maxHp;$('enemyText').textContent=s.enemy.hp+'/'+s.enemy.maxHp;$('enemyName').textContent=s.enemy.name;$('heroBar').style.width=100*s.hero.hp/s.hero.maxHp+'%';$('enemyBar').style.width=100*s.enemy.hp/s.enemy.maxHp+'%';$('toggle').textContent=s.enabled?'停止自動戰鬥':'啟動自動戰鬥';$('speed').textContent='速度 ×'+s.speed;$('gear').textContent='裝備：'+({starter:'初始劍',iron:'鐵劍',gold:'黃金劍'}[s.hero.equipment]||s.hero.equipment)+' · 攻擊 '+s.hero.attack;document.querySelectorAll('[data-equip]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.equip===s.hero.equipment));b.style.borderColor=b.dataset.equip===s.hero.equipment?'#a5e8bc':'#d7a45b'});const e=s.log[0];if(e){$('event').textContent=e.type==='defeat'?'敵人擊敗！獲得 '+e.reward+' 金幣':e.type==='recover'?'勇者恢復體力': '造成 '+e.damage+' 點傷害';const signature=JSON.stringify(s.log);if(signature!==lastLog){$('log').textContent=s.log.slice(0,4).map(x=>x.type==='hit'?'攻擊 '+x.damage:x.type==='defeat'?'擊敗敵人 +'+x.reward+' 金幣':'勇者恢復體力').join(' · ');lastLog=signature;}}}});
document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>game.equip(b.dataset.equip));game.emit();$('toggle').onclick=()=>game.setAuto(!game.state.enabled);$('speed').onclick=()=>game.setSpeed(game.state.speed===1?2:1);$('step').onclick=()=>{const was=game.state.enabled;game.state.enabled=true;game.tick();game.state.enabled=was;game.emit()};let elapsed=0;setInterval(()=>{elapsed+=100;if(game.state.enabled&&elapsed>=1000/game.state.speed){elapsed=0;game.tick()}},100);
</script></body></html>
