<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>薪水勇者 · V18 直式首頁</title><style>
*{box-sizing:border-box}body{margin:0;background:#100d1c;color:#fce6bb;font-family:system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}#app{max-width:480px;min-height:100dvh;margin:auto;display:flex;flex-direction:column;background:linear-gradient(165deg,#282039,#151325);box-shadow:0 0 35px #0008}.top{padding:calc(10px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(120deg,#35253e,#1b1a32);border-bottom:2px solid #9b7545}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-weight:1000;color:#ffce70;text-shadow:1px 2px #4a2340;font-size:23px}.coins{font-size:12px;color:#ffdf99}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:9px}.stat{border:1px solid #96744b;border-radius:8px;background:#211a2e;padding:7px 5px;text-align:center}.stat small{display:block;color:#cdbad1;font-size:10px}.stat b{font-size:14px;font-variant-numeric:tabular-nums}.office{position:relative;height:26dvh;min-height:170px;max-height:245px;overflow:hidden;background:linear-gradient(#28314f88,#37294155),url('../art/v18/home-scene-concept.webp') 53% 46%/auto 170% no-repeat;border-bottom:3px solid #c39553}.office:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#100f25aa,transparent 38%,#120e2488);pointer-events:none}.office .tag{position:absolute;z-index:2;left:10px;top:10px;background:#1e1739dc;border:1px solid #e6b970;border-radius:9px;padding:6px 9px;font-size:12px}.office .mood{position:absolute;z-index:2;right:10px;bottom:10px;background:#1b1537dc;padding:7px 10px;border-radius:10px;font-size:12px}.office .salary{position:absolute;z-index:2;left:10px;bottom:10px;background:#221a32e8;border:1px solid #d4a25d;border-radius:10px;padding:8px 10px}.salary small{display:block;font-size:10px;color:#dcc5b6}.salary strong{color:#ffe09a;font-size:22px}.battle{position:relative;flex:1;min-height:290px;overflow:hidden;background:radial-gradient(ellipse at 50% 25%,#554478 0%,#2b2749 48%,#151526 100%)}.battle:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 60%,#131021ad),repeating-linear-gradient(0deg,transparent 0 41px,#d9b7a00a 42px 44px);pointer-events:none}.battlehead{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:9px 11px;background:#181328d9;border-bottom:1px solid #a07b55}.wave{font-weight:800;font-size:14px}.toggle{border:1px solid #b78b55;background:#4a2f48;color:#ffdb97;border-radius:8px;padding:7px 9px;font-size:12px}.arena{position:absolute;inset:49px 0 57px;display:flex;align-items:center;justify-content:space-around;gap:2px;padding:0 7px}.fighter{width:49%;position:relative;text-align:center}.fighter img{display:block;width:100%;max-width:230px;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 7px 3px #090a1c9c)}.fighter .name{font-size:12px;text-shadow:0 2px #000}.fighter.enemy{width:43%}.mob{font-size:clamp(65px,21vw,115px);filter:drop-shadow(0 7px 4px #0009);animation:bob 2.2s ease-in-out infinite}.hp{height:7px;border:1px solid #d5a37c;background:#342237;border-radius:20px;overflow:hidden;margin:6px auto;max-width:130px}.hp i{display:block;background:linear-gradient(90deg,#e75d77,#ffb278);height:100%;width:100%;transition:width .2s}.hit{animation:shake .22s}.action{position:absolute;z-index:3;bottom:10px;left:10px;right:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.action button{background:linear-gradient(#6e4d69,#33263d);border:1px solid #d3a56b;color:#fff0cb;border-radius:10px;padding:10px 3px;font-size:13px}.log{position:absolute;z-index:3;left:10px;right:10px;bottom:58px;text-align:center;color:#f7d59e;font-size:12px;text-shadow:0 2px 3px #000}.nav{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:7px 5px calc(8px + env(safe-area-inset-bottom));background:#21192c;border-top:3px solid #c79855}.nav button{background:#392b40;border:1px solid #9a744a;color:#f9dfb4;border-radius:9px;padding:8px 1px;font-size:10px;min-width:0}.nav button span{display:block;font-size:21px;margin-bottom:2px}.nav button.selected{background:#76502e;box-shadow:inset 0 0 0 1px #ffd487}dialog{background:#231a34;color:#f6dfbd;border:2px solid #d0a367;border-radius:14px;max-width:min(92vw,420px);line-height:1.7}dialog::backdrop{background:#000b}dialog button{width:100%;padding:10px;background:#664b52;color:#fff;border:1px solid #d0a367;border-radius:8px}@keyframes bob{50%{transform:translateY(-7px)}}@keyframes shake{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}@media(max-height:700px){.office{height:22dvh;min-height:125px}.battle{min-height:240px}.arena{bottom:45px}.action{bottom:5px}.nav button{padding:5px 1px}}
</style></head><body><div id="app"><header class="top"><div class="topline"><div class="brand">薪水勇者 <small style="font-size:10px;color:#d7bfa4">V18 直式測試</small></div><div class="coins">🪙 <b id="gold">0</b>　💎 0</div></div><div class="stats"><div class="stat"><small>上班計時</small><b id="clock">00:00:00</b></div><div class="stat"><small>今日已賺</small><b id="today">NT$0.00</b></div><div class="stat"><small>薪資進度</small><b id="percent">0.0%</b></div></div></header><section class="office"><div class="tag">☕ 辦公室 · 掛機中</div><div class="salary"><small>即時薪資（示範設定）</small><strong id="salary">NT$0.00</strong></div><div class="mood">💤 人在上班，魂在打怪</div></section><section class="battle"><div class="battlehead"><div class="wave">⚔️ 第 <span id="wave">1</span> 關 · 辦公室走廊</div><button class="toggle" id="auto">自動戰鬥 ON</button></div><div class="arena"><div class="fighter"><img id="hero" src="../art/v18/runtime/hero/frames/idle-01.webp" alt="社畜勇者"><div class="name">Lv.1 社畜勇者</div><div class="hp"><i id="hero-hp"></i></div></div><div class="fighter enemy" id="enemy"><div class="mob">🖨️</div><div class="name">加班印表機</div><div class="hp"><i id="enemy-hp"></i></div></div></div><div class="log" id="log" role="status">勇者正在夢境裡加班……</div><div class="action"><button id="attack">💥 手動攻擊</button><button id="speed">⏩ 速度 ×1</button><button id="salary-setting">💵 設定時薪</button></div></section><nav class="nav"><button class="selected" data-panel="首頁"><span>🏠</span>首頁</button><button data-panel="角色"><span>🧑‍💼</span>角色</button><button data-panel="冒險"><span>⚔️</span>冒險</button><button data-panel="裝備"><span>🛡️</span>裝備</button><button data-panel="圖鑑"><span>📖</span>圖鑑</button><button data-panel="寵物"><span>🐈</span>寵物</button><button data-panel="商店"><span>🛍️</span>商店</button></nav></div><dialog id="dialog"><h3 id="dialog-title"></h3><div id="dialog-body"></div><button id="close">關閉</button></dialog><script type="module">
import {BattleState} from './battle-state.mjs';
const $=s=>document.querySelector(s);const game=new BattleState({onChange:update});
let auto=true,speed=1,action='idle',actionUntil=0,frame=0,rate=Number(localStorage.getItem('salary-v18-hourly')||190),shiftStart=Date.now(),lastStrike=0;
const frames={idle:['idle-01','idle-02'],walk:['walk-01','walk-02'],attack:['attack-01','attack-02','attack-03'],hurt:['hurt-01','hurt-02'],sleep:['sleep-01','sleep-02']};
function update(s){$('#wave').textContent=s.wave;$('#gold').textContent=s.gold;$('#hero-hp').style.width=(s.hero.hp/s.hero.maxHp*100)+'%';$('#enemy-hp').style.width=(s.enemy.hp/s.enemy.maxHp*100)+'%';}
update(game.state);
function strike(){const before=game.state.kills;game.tick({manual:true});action='attack';actionUntil=performance.now()+500;$('#enemy').classList.remove('hit');void $('#enemy').offsetWidth;$('#enemy').classList.add('hit');$('#log').textContent=game.state.kills>before?'🎁 擊敗加班印表機！獲得金幣與經驗':'💥 筆電暴擊！傷害已結算';}
$('#attack').onclick=strike;$('#auto').onclick=()=>{auto=!auto;game.setAuto(auto);$('#auto').textContent='自動戰鬥 '+(auto?'ON':'OFF')};$('#speed').onclick=()=>{speed=speed===1?2:1;game.setSpeed(speed);$('#speed').textContent='⏩ 速度 ×'+speed};
const dialog=$('#dialog');function panel(title,body){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;dialog.showModal()}$('#close').onclick=()=>dialog.close();
$('#salary-setting').onclick=()=>{panel('薪資計算設定','<p>請輸入實際時薪（新台幣）。此版本從開啟頁面開始計時，非真實出勤紀錄。</p><input id="hourly" type="number" min="1" max="100000" value="'+rate+'" style="width:100%;padding:10px"><button id="save" style="margin:10px 0">儲存時薪</button>');$('#save').onclick=()=>{const n=Number($('#hourly').value);if(!Number.isFinite(n)||n<=0||n>100000)return;rate=n;localStorage.setItem('salary-v18-hourly',String(rate));dialog.close()}};
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-panel]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');const p=b.dataset.panel;if(p==='首頁')return;panel(p,'<p>此頁為 V18 直式首頁工程試玩。'+p+'功能尚未與正式 V17 存檔整合。</p><p>目前可操作：自動戰鬥、手動攻擊、戰鬥加速、時薪設定。</p>')});
function loop(now){const seconds=(Date.now()-shiftStart)/1000;const earned=seconds*rate/3600;$('#clock').textContent=new Date(seconds*1000).toISOString().slice(11,19);$('#today').textContent='NT$'+earned.toFixed(2);$('#salary').textContent='NT$'+earned.toFixed(2);$('#percent').textContent=(Math.min(100,earned/(rate*8)*100)).toFixed(1)+'%';if(auto&&now-lastStrike>1100/speed){lastStrike=now;strike()}const pose=now<actionUntil?'attack':auto?'idle':'sleep';const seq=frames[pose];const index=Math.floor(now/(pose==='attack'?130:400))%seq.length;const key=seq[index];if($('#hero').dataset.frame!==key){$('#hero').dataset.frame=key;$('#hero').src='../art/v18/runtime/hero/frames/'+key+'.webp'}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
