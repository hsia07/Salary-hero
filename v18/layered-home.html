<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>薪水勇者 V18 · 獨立圖層首頁</title><style>
:root{--gold:#f4c879;--ink:#160e27}*{box-sizing:border-box}html,body{margin:0;background:#090816;color:#ffeac7;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}main{width:min(100%,480px);margin:auto;min-height:100dvh;display:grid;grid-template-rows:auto minmax(190px,31dvh) minmax(270px,1fr) auto;background:#1c1530;overflow:hidden}.hud{position:relative;z-index:10;background:linear-gradient(125deg,#4c2c4c,#17152d);border-bottom:3px solid #e2ad54;padding:calc(8px + env(safe-area-inset-top)) 9px 7px}.hudtop{display:flex;align-items:center;justify-content:space-between;gap:5px}.logo{font-weight:1000;font-size:20px;color:#ffd26d;text-shadow:1px 2px #4b213c}.resources{display:flex;gap:4px}.resources span{font-size:11px;border:1px solid #dca95e;border-radius:30px;background:#241729;padding:5px}.hudsub{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:#ebd0b3}.office{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 53% 60%,#d3a16455,transparent 40%),linear-gradient(135deg,#3b294b,#242749 55%,#171a38);border-bottom:4px solid #c78f51}.office-bg{position:absolute;inset:0;z-index:0;pointer-events:none}.window{position:absolute;left:31%;top:6%;width:42%;height:65%;border:7px solid #654d71;border-radius:90px 90px 7px 7px;background:linear-gradient(#5b79b9,#32336d 65%,#25224e);box-shadow:0 0 26px #9a76d355,inset 0 0 18px #d5a0ff55}.window:before{content:"";position:absolute;inset:0;border-left:4px solid #493a60;border-right:4px solid #493a60;left:47%;right:47%}.window:after{content:"";position:absolute;left:0;right:0;top:47%;border-top:5px solid #493a60}.shelf{position:absolute;top:9%;height:75%;width:23%;background:repeating-linear-gradient(90deg,#392b46 0 8px,#664460 9px 13px,#2e294e 14px 19px);border:6px solid #886044;box-shadow:inset 0 0 15px #090714}.shelf.left{left:-6%}.shelf.right{right:-8%}.office-actors{position: y:flex;align-items:center;justify-content:space-between;pointer-events:none}.unit{width:50%;text-align:center;position:relative}.unit img{display:block;width:100%;max-height:min(31dvh,220px);object-fit:contain;filter:drop-shadow(0 7px 3px #100c24)}.enemy{width:43%;font-size:clamp(60px,17vw,105px);filter:drop-shadow(0 7px 3px #100c24)}.enemy.hit{animation:shake .2s}.battle-units .unit:first-child{transition:transform .22s cubic-bezier(.15,.8,.25,1);will-change:transform}.battle-units .unit:first-child.lunge{transform:translateX(var(--lunge,0px))}.battle-units .unit:first-child.recover{transition:transform .26s ease-in-out}.damage{position:absolute;z-index:5;left:70%;top:32%;color:#ff6682;font-size:clamp(20px,6vw,31px);font-weight:1000;text-shadow:2px 3px #370a2c;pointer-events:none;opacity:0}.damage.show{animation:damage-pop .65s ease-out}.battle-units .unit:first-child{z-index:3}@keyframes damage-pop{0%{opacity:0;transform:translateY(8px) scale(.6)}20%{opacity:1;transform:translateY(-6px) scale(1.25)}80%{opacity:1}100%{opacity:0;transform:translateY(-33px)}}.hp{width:85%;height:7px;background:#3a213e;border:1px solid #f6c381;border-radius:10px;margin:0 auto;overflow:hidden}.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ee6684,#ffae7d)}.unitname{font-size:11px;text-shadow:0 2px #000}.fx{position:absolute;z-index:4;left:45%;top:42%;font-size:42px;pointer-events:none;opacity:0}.fx.show{animation:flash .35s}.loot{position:absolute;z-index:5;right:6px;top:62px;border:1px solid #f4c879;background:#241831e8;border-radius:10px;padding:6px;font-size:11px;max-width:27%;text-align:center}.battle-controls{position:absolute;z-index:7;left:7px;right:7px;bottom:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.battle-controls button{border:2px solid #c9914f;background:linear-gradient(#6d3d55,#32203f);border-radius:10px;padding:9px 3px;font-size:12px}.battle-log{position:absolute;z-index:5;left:5px;right:5px;bottom:56px;text-align:center;font-size:11px;color:#ffe5a4;text-shadow:0 2px #000}.nav{position:relative;z-index:10;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;padding:7px 4px calc(8px + env(safe-area-inset-bottom));border-top:3px solid #dfab5c;background:linear-gradient(#51314b,#251a31)}.nav button{min-width:0;border:1px solid #c38d54;border-radius:7px;background:linear-gradient(#59334b,#2d203a);padding:6px 0 5px;font-size:9px}.nav button span{display:block;font-size:clamp(17px,5vw,26px)}.nav button.active{box-shadow:inset 0 0 0 2px #f8cf7b;background:#785035}dialog{max-width:min(90vw,420px);background:#281a38;border:2px solid #e2b26d;border-radius:12px;color:#ffedc8;line-height:1.7}dialog::backdrop{background:#000a}dialog button{border:1px solid #c99956;border-radius:8px;background:#593650;padding:9px;width:100%}dialog input{width:100%;padding:9px;margin:7px 0}@keyframes shake{25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}@keyframes flash{10%,60%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(.8)}}@media(max-height:710px){main{grid-template-rows:auto minmax(140px,25dvh) minmax(240px,1fr) auto}.battle-units{top:17%;bottom:24%}.battle-head{height:40px}.loot{top:45px}}
</style></head><body><main><header class="hud"><div class="hudtop"><div class="logo">薪水勇者</div><div class="resources"><span>🪙 <b id="gold">0</b></span><span>💎 0</span><span>⚡ 120</span></div></div><div class="hudsub"><span>Lv.1 社畜勇者・夏</span><span>V18 獨立圖層試玩</span></div></header><section class="office" aria-label="辦公室場景"><div class="office-bg"><div class="window"></div><div class="shelf left"></div><div class="shelf right"></div></div><div class="office-actors"><div class="desk"></div><img class="sleep-hero" src="../art/v18/runtime/hero/frames/sleep-02.webp" alt="睡著的勇者"><span class="laptop">💻</span><span class="cat">🐈</span></div><div class="office-ui"><div class="plaque">🕘 上班中…<br>自動工作中<br><b id="clock">00:00:00</b></div><div class="salary">💰 今日薪資<strong id="salary">NT$0.00</strong><small>月薪目標 NT$40,000</small><small id="progress">0.00%</small></div></div></section><section class="battle" aria-label="夢境戰鬥場景"><div class="battle-bg"></div><div class="battle-head"><span>☠ 第 <b id="wave">1</b> 關・辦公室走廊</span><span>🎁 <b id="kills">0</b> 擊敗</span></div><div class="battle-units"><div class="unit"><img id="hero" src="../art/v18/runtime/hero/frames/idle-01.webp" alt="戰鬥中的社畜勇者"><div class="unitname">社畜勇者</div><div class="hp"><i id="hero-hp"></i></div></div><div class="unit"><div class="enemy" id="enemy">🖨️</div><div class="unitname">加班印表機</div><div class="hp"><i id="enemy-hp"></i></div></div></div><div class="fx" id="fx">💥</div><div class="damage" id="damage">-0</div><div class="loot">戰利品<br>🪙 <b id="loot-gold">0</b><br>📄 ×<b id="loot-paper">0</b></div><div class="battle-log" id="log">上班族在夢裡也不能下班……</div><div class="battle-controls"><button id="auto">⚔ 自動 ON</button><button id="speed">⏩ ×1</button><button id="salary-config">💵 時薪設定</button></div></section><nav class="nav"><button class="active" data-panel="首頁"><span>🏠</span>首頁</button><button data-panel="角色"><span>🧑‍💼</span>角色</button><button data-panel="冒險"><span>⚔️</span>冒險</button><button data-panel="裝備"><span>🛡️</span>裝備</button><button data-panel="鍛造"><span>🔨</span>鍛造</button><button data-panel="寵物"><span>🐈</span>寵物</button><button data-panel="公會"><span>🏰</span>公會</button><button data-panel="商店"><span>🛍️</span>商店</button></nav></main><dialog id="dialog"><h3 id="title"></h3><div id="body"></div><button id="close">關閉</button></dialog><script type="module">
import {BattleState} from './battle-state.mjs';
const $=s=>document.querySelector(s);const game=new BattleState({onChange:render});let auto=true,speed=1,last=0,attackEnd=0,rate=Number(localStorage.getItem('salary-v18-hourly')||190),started=Date.now(),paper=0,frame='',busy=false,attackTimers=[];
function render(s){$('#gold').textContent=s.gold;$('#loot-gold').textContent=s.gold;$('#kills').textContent=s.kills;$('#wave').textContent=s.wave;$('#hero-hp').style.width=100*s.hero.hp/s.hero.maxHp+'%';$('#enemy-hp').style.width=100*s.enemy.hp/s.enemy.maxHp+'%';}render(game.state);
function strike(now=performance.now()){
 if(busy)return;
 busy=true;
 const hero=$('.battle-units .unit:first-child'),enemy=$('#enemy'),sprite=$('#hero');
 const h=hero.getBoundingClientRect(),e=enemy.getBoundingClientRect(),img=sprite.getBoundingClientRect();
 // The sprite has transparent padding. Aim the laptop near the right side of its visible body,
 // not at the outer edge of the 512px image canvas.
 const contactX=img.left+img.width*.80;
 const targetX=e.left+e.width*.17;
 const travel=Math.max(0,Math.min(targetX-contactX,window.innerWidth*.42));
 hero.style.setProperty('--lunge',travel+'px');
 hero.classList.remove('recover');
 hero.classList.add('lunge');
 attackEnd=now+950;
 $('#log').textContent='💼 衝刺中！筆電準備命中……';
 let impacted=false;
 const impact=()=>{
  if(impacted)return;impacted=true;
  const before=game.state.kills;
  game.tick({manual:true});
  const damage=game.state.log.find(x=>x.type==='hit')?.damage||0;
  const dmg=$('#damage');
  dmg.textContent='-'+damage;
  const eb=enemy.getBoundingClientRect(),bb=$('.battle').getBoundingClientRect();
  dmg.style.left=(eb.left-bb.left+eb.width*.15)+'px';
  dmg.style.top=(eb.top-bb.top-35)+'px';
  dmg.classList.remove('show');void dmg.offsetWidth;dmg.classList.add('show');
  const fx=$('#fx');
  fx.style.left=(eb.left-bb.left-23)+'px';
  fx.style.top=(eb.top-bb.top+eb.height*.24)+'px';
  fx.classList.remove('show');void fx.offsetWidth;fx.classList.add('show');
  enemy.classList.remove('hit');void enemy.offsetWidth;enemy.classList.add('hit');
  if(game.state.kills>before){paper++;$('#loot-paper').textContent=paper;$('#log').textContent='🎁 正面命中！加班印表機被擊敗'}
  else $('#log').textContent='💥 筆電撞上印表機！';
  setTimeout(()=>{hero.classList.remove('lunge');hero.classList.add('recover')},115/speed);
  setTimeout(()=>{hero.classList.remove('recover');busy=false},480/speed);
 };
 // Damage is applied at the end of the forward movement, not when the animation begins.
 const onEnd=ev=>{if(ev.propertyName==='transform'){hero.removeEventListener('transitionend',onEnd);impact()}};
 hero.addEventListener('transitionend',onEnd);
 // Handle reduced motion / missing transitionend without a permanently stuck attack.
 setTimeout(()=>{hero.removeEventListener('transitionend',onEnd);impact()},360/speed);
}
$('#auto').onclick=()=>{auto=!auto;game.setAuto(auto);$('#auto').textContent='⚔ 自動 '+(auto?'ON':'OFF')};$('#speed').onclick=()=>{speed=speed===1?2:1;game.setSpeed(speed);$('#speed').textContent='⏩ ×'+speed};const dialog=$('#dialog');function open(t,html){$('#title').textContent=t;$('#body').innerHTML=html;dialog.showModal()}$('#close').onclick=()=>dialog.close();$('#salary-config').onclick=()=>{open('即時薪資設定','<p>輸入時薪。計時從本次開啟頁面開始，並非實際出勤紀錄。</p><input id="rate" type="number" min="1" max="100000" value="'+rate+'"><button id="save">儲存時薪</button>');$('#save').onclick=()=>{const n=Number($('#rate').value);if(n>0&&n<=100000){rate=n;localStorage.setItem('salary-v18-hourly',String(n));dialog.close()}}};document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-panel]').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.panel==='首頁')return;open(b.dataset.panel,'<p>此功能尚在施工；目前首頁的薪資、角色動畫、自動戰鬥、掉寶數值是獨立運作的。</p>')});
const seq={idle:['idle-01','idle-02'],attack:['attack-01','attack-02','attack-03'],sleep:['sleep-01','sleep-02']};function loop(now){let sec=(Date.now()-started)/1000,earn=sec*rate/3600;$('#clock').textContent=new Date(sec*1000).toISOString().slice(11,19);$('#salary').textContent='NT$'+earn.toFixed(2);$('#progress').textContent=(earn/40000*100).toFixed(2)+'%';if(auto&&!busy&&now-last>1150/speed){last=now;strike(now)}const pose=now<attackEnd?'attack':auto?'idle':'sleep';const list=seq[pose],next=list[Math.floor(now/(pose==='attack'?145:480))%list.length];if(next!==frame){frame=next;$('#hero').src='../art/v18/runtime/hero/frames/'+next+'.webp'}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
