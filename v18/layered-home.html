let workShop={spent:0,owned:['starter'],equipped:'starter'};
try{const saved=JSON.parse(localStorage.getItem(WORK_SHOP_KEY)||'{}');if(saved&&typeof saved==='object'){workShop={...workShop,...saved};}}catch{}
const WORK_ITEMS=[{id:'starter',name:'皺巴巴的公事包',cost:0,attack:12,desc:'入職贈品。看起來裝了很多責任。'},{id:'iron',name:'加班鐵製筆電',cost:6,attack:18,desc:'硬得像星期一的鬧鐘。'},{id:'gold',name:'黃金離職通知書',cost:15,attack:26,desc:'攻擊力很高，但人資不批准。'}];
function rewardBalance(){const claimed=Object.values(rewardLedger).reduce((sum,n)=>sum+Math.max(0,Math.min(9,Number(n)||0)),0);return Math.max(0,claimed-Math.max(0,Number(workShop.spent)||0))}
function saveWorkShop(){try{localStorage.setItem(WORK_SHOP_KEY,JSON.stringify(workShop))}catch{}}
function refreshWorkShop(){const valid=WORK_ITEMS.find(i=>i.id===workShop.equipped&&workShop.owned.includes(i.id));const item=valid||WORK_ITEMS[0];if(!valid)workShop.equipped='starter';game.equip(item.id);const gear=$('#hero-gear');gear.dataset.tier=item.id;gear.textContent=item.id==='gold'?'📜':item.id==='iron'?'💻':'💼';gear.setAttribute('aria-label',item.name);$('#gear-label').textContent=item.name;}
function showWorkShop(){
 const balance=rewardBalance();
 const html='<div class="shop-balance">📋 可用打工徽章：'+balance+' 枚</div><div class="shop-grid">'+WORK_ITEMS.map(item=>{
 const owned=workShop.owned.includes(item.id),equipped=workShop.equipped===item.id;
 return '<div class="shop-item"><strong>'+(item.id==='gold'?'📜 ':item.id==='iron'?'💻 ':'💼 ')+item.name+'</strong><small>⚔ 攻擊 '+item.attack+' · '+item.desc+'</small><button type="button" data-buy="'+item.id+'" '+(equipped?'disabled':'')+'>'+(equipped?'✓ 裝備中':owned?'穿上裝備':'解鎖 · '+item.cost+' 徽章')+'</button></div>'
 }).join('')+'</div><p style="font-size:11px;color:#cbb6c9">解鎖永久保存於此瀏覽器；徽章與真實薪資分開計算。裝備提升實際戰鬥傷害。</p>';
 open('🎒 社畜裝備間',html);
 document.querySelectorAll('[data-buy]').forEach(btn=>btn.onclick=()=>{
  const item=WORK_ITEMS.find(x=>x.id===btn.dataset.buy);if(!item)return;
  if(!workShop.owned.includes(item.id)){
   if(rewardBalance()<item.cost){$('#log').textContent='徽章不足，繼續上班才能解鎖！';return}
   workShop.spent=Math.max(0,Number(workShop.spent)||0)+item.cost;
   workShop.owned.push(item.id);
  }
  workShop.equipped=item.id;saveWorkShop();refreshWorkShop();dialog.close();$('#log').textContent='⚔ 已裝備 '+item.name+'，攻擊力 '+item.attack;
  payrollRender();
 });
}
let rewardTodayKey='',rewardAvailable=0;
function renderWorkReward(y,m,day,paidMs){
 const key=y+'-'+String(m).padStart(2,'0')+'-'+String(day).padStart(2,'0');
 const earned=Math.min(9,Math.floor(paidMs/3600000));
 const claimed=Math.max(0,Math.min(9,Number(rewardLedger[key]||0)));
 rewardTodayKey=key;rewardAvailable=Math.max(0,earned-claimed);
 $('#work-reward-info').innerHTML='📋 徽章 <strong>'+rewardBalance()+'</strong> 枚 · 今日 '+earned+'/9';
 const btn=$('#work-reward-claim');btn.disabled=rewardAvailable===0;
 btn.textContent=rewardAvailable?'領取 +'+rewardAvailable:'等待累積';
}
$('#work-reward-shop').onclick=showWorkShop;
$('#work-reward-claim').onclick=()=>{
 if(!rewardTodayKey||rewardAvailable<=0)return;
 const n=rewardAvailable;rewardLedger[rewardTodayKey]=Math.min(9,Number(rewardLedger[rewardTodayKey]||0)+n);
 try{localStorage.setItem(WORK_REWARD_KEY,JSON.stringify(rewardLedger))}catch{}
 rewardAvailable=0;$('#work-reward-claim').disabled=true;$('#work-reward-claim').textContent='已領取';
 $('#log').textContent='🎁 上班掛機獎勵 +'+n+' 枚徽章！';
 payrollRender();
};
function payrollRender(){
 const now=Date.now(),p=payrollParts(now);
 let conf={monthly:40000,breakMinutes:0,weekends:false,excluded:''};
 try{conf={...conf,...JSON.parse(localStorage.getItem('salary-hero-pay-settings-v1')||'{}')}}catch{}
 const excluded=new Set(String(conf.excluded||'').split(',').map(x=>Number(x.trim())).filter(x=>Number.isInteger(x)&&x>=1&&x<=31));
 const days=new Date(Date.UTC(p.y,p.m,0)).getUTCDate();
 const duration=(540-Number(conf.breakMinutes||0))*60000;
 const eligible=(y,m,d,skip)=>{const w=new Date(Date.UTC(y,m-1,d)).getUTCDay();return (conf.weekends||(w!==0&&w!==6))&&!skip.has(d)};
 const paid=(y,m,d,until,skip)=>{if(!eligible(y,m,d,skip))return 0;const from=payrollStamp(y,m,d,8),to=payrollStamp(y,m,d,17);let ms=Math.max(0,Math.min(until,to)-from);if(Number(conf.breakMinutes)===60){const a=payrollStamp(y,m,d,12),b=payrollStamp(y,m,d,13);ms-=Math.max(0,Math.min(until,b)-Math.max(from,a))}return Math.max(0,Math.min(duration,ms))};
 let workdays=0;for(let d=1;d<=days;d++)if(eligible(p.y,p.m,d,excluded))workdays++;
 const rate=workdays&&duration>0?Number(conf.monthly)/(workdays*duration):0;
 const todayMs=paid(p.y,p.m,p.day,now,excluded);renderWorkReward(p.y,p.m,p.day,todayMs);
 const offset=(p.weekday+6)%7,weekStart=payrollStamp(p.y,p.m,p.day-offset);
 let week=0,month=0;for(let d=1;d<=p.day;d++){const ms=paid(p.y,p.m,d,now,excluded);month+=ms*rate;if(payrollStamp(p.y,p.m,d)>=weekStart)week+=ms*rate}
 if(weekStart<payrollStamp(p.y,p.m,1)){const prev=payrollParts(weekStart),last=new Date(Date.UTC(prev.y,prev.m,0)).getUTCDate(),skip=new Set();let count=0;for(let d=1;d<=last;d++)if(eligible(prev.y,prev.m,d,skip))count++;const prevRate=count&&duration>0?Number(conf.monthly)/(count*duration):0;for(let d=prev.day;d<=last;d++)week+=paid(prev.y,prev.m,d,now,skip)*prevRate}
 const fmt=(n,dec=0)=>'NT$'+n.toLocaleString('zh-TW',{minimumFractionDigits:dec,maximumFractionDigits:dec});
 $('#salary').textContent=fmt(todayMs*rate,2);
 $('#clock').textContent=String(Math.floor(todayMs/3600000)).padStart(2,'0')+':'+String(Math.floor(todayMs/60000)%60).padStart(2,'0')+':'+String(Math.floor(todayMs/1000)%60).padStart(2,'0');
 $('#salary-hint').textContent='本週 '+fmt(week)+' · 本月 '+fmt(month);
 const active=eligible(p.y,p.m,p.day,excluded)&&p.h>=8&&p.h<17&&!(Number(conf.breakMinutes)===60&&p.h===12);
 const scheduled=eligible(p.y,p.m,p.day,excluded);
 const complete=scheduled&&p.h>=17;
 const paused=scheduled&&Number(conf.breakMinutes)===60&&p.h===12;
 const nextShift=()=>{for(let add=0;add<10;add++){const d=new Date(Date.UTC(p.y,p.m-1,p.day+add));const y=d.getUTCFullYear(),m=d.getUTCMonth()+1,day=d.getUTCDate();if(!eligible(y,m,day,m===p.m&&y===p.y?excluded:new Set()))continue;if(add===0&&p.h<8)return '今日 08:00 開始';if(add===0&&p.h<17)return '今日 17:00 下班';return (d.getUTCMonth()+1)+'/'+day+' 08:00 開始'}return '等待下次班表'};
 const status=active?'● 計薪中':paused?'Ⅱ 午休暫停':complete?'✓ 今日已結算':scheduled&&p.h<8?'☀ 等待上班':'☕ 休息日';
 $('#progress').textContent=status;
 $('.plaque').firstChild.textContent=active?'🟢 上班中…':paused?'☕ 午休時間':complete?'🏁 今日下班':scheduled&&p.h<8?'⏳ 等待上班':'😴 休假掛機';
 $('#salary-hint').textContent=p.m+'/'+p.day+' · 本週 '+fmt(week)+' · 本月 '+fmt(month);
 const next=nextShift();$('.plaque').setAttribute('title',next);if(!active&&!complete&&!paused)$('#salary-hint').textContent=p.m+'/'+p.day+' · '+next+' · 本月 '+fmt(month);
 const percent=Math.max(0,Math.min(100,Number(conf.monthly)>0?month/Number(conf.monthly)*100:0));
 $('#pay-track-fill').style.width=percent.toFixed(2)+'%';
 $('#pay-track-label').textContent='本月薪資進度 '+percent.toFixed(1)+'%';
 const hhmmss=ms=>{const secs=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(secs/3600)).padStart(2,'0')+':'+String(Math.floor(secs/60)%60).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')};
 if(active||paused){$('#shift-countdown').textContent='距離下班 '+hhmmss(payrollStamp(p.y,p.m,p.day,17)-now)}
 else if(complete){$('#shift-countdown').textContent='今日工時完成 ✓'}
 else{$('#shift-countdown').textContent='下次上班：'+next}


}
refreshWorkShop();payrollRender();setInterval(payrollRender,1000);
const seq={idle:['idle-01','idle-02'],attack:['attack-01','attack-02','attack-03'],sleep:['sleep-01','sleep-02']};window.addEventListener('message',event=>{if(event.origin!==location.origin||!event.data||event.data.type!=='salary-hero-pay')return;payrollRender();});
function loop(now){if(auto&&!busy&&now-last>1150/speed){last=now;strike(now)}const pose=now<attackEnd?'attack':auto?'idle':'sleep';const list=seq[pose],next=list[Math.floor(now/(pose==='attack'?145:480))%list.length];if(next!==frame){frame=next;$('#hero').src='../art/v18/runtime/hero/frames/'+next+'.webp'}requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
