<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>薪水勇者 V18 美術資源驗收</title><style>body{margin:0;background:#151021;color:#f5e4c7;font:15px system-ui,-apple-system,sans-serif}main{max-width:680px;margin:auto;padding:22px}h1{font-size:23px}.muted{color:#c5b8d1;line-height:1.7}.item{border:1px solid #6b5368;border-radius:10px;margin:8px 0;padding:12px;overflow-wrap:anywhere}.bad{color:#ff9f9f}.good{color:#9de3bf}button{background:#4e3553;border:1px solid #e4ba74;border-radius:10px;padding:12px;color:white}code{color:#dfc89b}</style></head><body><main><h1>V18 美術整合包 · 真實資源驗收</h1><p class="muted">這個頁面直接讀取 GitHub Pages 上的實際圖檔，檢查能否載入、尺寸，以及角色素材是否具有透明區域；不使用整張概念圖冒充已完成的分層素材。透明度抽樣不能取代人工視覺審核。</p><button id="retry">重新檢查</button><h2 id="summary">檢查中…</h2><div id="results"></div><p class="muted">只有素材完整且通過人工檢查後，才允許替換正式戰鬥畫面。<a style="color:#ffd596" href="./battle-test.html">返回戰鬥引擎</a></p></main><script type="module">import {auditAssets} from './asset-audit.mjs';const summary=document.getElementById('summary'),list=document.getElementById('results');async function run(){summary.textContent='正在讀取實際素材…';list.replaceChildren();try{const data=await auditAssets();const passed=data.results.filter(x=>x.ok).length;summary.textContent=(data.ready?'檔案預檢通過':'尚未具備正式整合條件')+' · '+passed+'/'+data.results.length+' 個素材通過';for(const item of data.results){const el=document.createElement('div');el.className='item';const status=document.createElement('strong');status.className=item.ok?'good':'bad';status.textContent=item.ok?'✓ 已載入':'✕ 未通過';const path=document.createElement('div');path.textContent=item.path;const detail=document.createElement('small');detail.textContent=[item.reason,item.width?item.width+'×'+item.height:'',item.alpha||''].filter(Boolean).join(' · ');el.append(status,path,detail);list.append(el)}}catch(e){summary.textContent='無法檢查：'+e.message}}document.getElementById('retry').onclick=run;run();</script></body></html>
