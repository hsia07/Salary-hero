<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142735"><title>薪水勇者</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf0e9;background:#0e1b25}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;padding:22px 18px 85px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:22px;margin:0}small,.muted{color:#9eafa9}.pill{border:1px solid #45615b;border-radius:50px;padding:6px 11px;font-size:12px}.panel{background:#1a303a;border:1px solid #37515a;border-radius:20px;padding:20px;margin-bottom:14px}.money{text-align:center;padding:30px 8px}.money strong{display:block;font-size:42px;letter-spacing:-1px;color:#f0d18a;margin:8px 0;font-variant-numeric:tabular-nums}.progress{height:9px;border-radius:20px;background:#334b50;overflow:hidden;margin:15px 0}.fill{height:100%;background:#dfb96f;width:0%;transition:width .4s}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.scene{height:170px;background:linear-gradient(#284852,#172c39);border-radius:14px;position:relative;overflow:hidden;margin:15px 0}.moon{position:absolute;right:40px;top:25px;width:38px;height:38px;border-radius:50%;background:#f5d49a}.hill{position:absolute;bottom:-48px;width:130%;left:-15%;height:130px;border-radius:50%;background:#284b48}.hero{position:absolute;bottom:25px;left:21%;width:65px;height:80px}.hero:before{content:'';position:absolute;width:40px;height:40px;border-radius:13px 13px 16px 16px;background:#f0c5a0;left:13px;top:4px;box-shadow:0 -9px #28364b}.hero:after{content:'';position:absolute;width:56px;height:35px;border-radius:14px 14px 5px 5px;background:#73999a;bottom:0;left:5px}.monster{position:absolute;right:18%;bottom:23px;width:70px;height:55px;background:#b57f9c;border-radius:50% 50% 38% 38%;box-shadow:inset 0 -10px #935b7c}.monster:after{content:'•   •';position:absolute;left:23px;top:12px;color:#2e2835}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}button{border:1px solid #58706b;background:#29474d;color:#f4f2e8;padding:14px 10px;border-radius:13px;font-size:15px;font-weight:600;cursor:pointer}button:active{transform:scale(.98);background:#426b68}button.primary{background:#b78a4e;color:#101e27;border-color:#d1a765}.tabs{position:fixed;bottom:0;left:0;right:0;background:#142832;border-top:1px solid #37515a;display:flex;justify-content:center;z-index:5}.tabs button{flex:1;max-width:170px;border:0;background:transparent;border-radius:0;font-size:13px;padding:16px 5px}.tabs button.active{color:#f0d18a;border-top:2px solid #f0d18a}.hidden{display:none}.notice{min-height:28px;color:#e8c58b;text-align:center;font-size:13px;margin-top:12px}ul{padding-left:22px;line-height:2}input{background:#0e2029;border:1px solid #58706b;color:white;border-radius:9px;padding:9px;width:100%}
</style></head><body><main class="app"><header><h1>薪水勇者 <small>V2.1</small></h1><span class="pill" id="status">計算中</span></header>
<section id="home"><div class="panel money"><small>今天已獲得的薪水</small><strong id="earned">NT$ 0.00</strong><small id="rate"></small><div class="progress"><div class="fill" id="bar"></div></div><div class="row"><small id="clock"></small><small id="remaining"></small></div></div>
<div class="panel"><div class="row"><b>下班魔王</b><small id="boss"></small></div><div class="scene"><div class="moon"></div><div class="hill"></div><div class="hero"></div><div class="monster"></div></div><div class="buttons"><button id="attack" class="primary">攻擊魔王</button><button id="chest">開啟寶箱</button></div><p class="notice" id="notice">勇者正在等待冒險。</p></div></section>
<section id="pet" class="hidden"><div class="panel"><h2>旅途夥伴</h2><p>一隻安靜陪你上班的小貓。</p><div class="scene"><div class="moon"></div><div class="hill"></div><div style="position:absolute;bottom:27px;left:40%;width:90px;height:70px;border-radius:45%;background:#d3a77c"><div style="position:absolute;top:-17px;left:12px;width:22px;height:32px;background:#d3a77c;transform:rotate(-25deg)"></div><div style="position:absolute;top:-17px;right:12px;width:22px;height:32px;background:#d3a77c;transform:rotate(25deg)"></div><div style="text-align:center;margin-top:15px;color:#302b2a">•　•<div>ᴗ</div></div></div></div><p id="petText">親密度 0</p><button id="feed" class="primary">餵食小貓</button></div></section>
<section id="achievements" class="hidden"><div class="panel"><h2>荒謬成就</h2><ul id="achList"></ul></div><div class="panel"><h2>遊戲設定</h2><p class="muted">月薪 40,000 元，每週一至五 08:00–17:00，包含午休。</p><button id="demo">測試模式：前進一小時</button><p class="muted">測試模式只影響遊戲進度，不會增加真實薪資。</p></div></section></main>
<nav class="tabs"><button class="active" data-tab="home">冒險</button><button data-tab="pet">寵物</button><button data-tab="achievements">成就</button></nav>
<script>
(()=>{'use strict';const KEY='salary-hero-v21';let save;try{save=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{save={}};save={hits:0,chests:0,food:0,bonus:0,...save};const $=id=>document.getElementById(id);const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch{}};const fmt=n=>'NT$ '+n.toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2});const days=(y,m)=>{let n=0;for(let d=1;d<=new Date(y,m+1,0).getDate();d++){let w=new Date(y,m,d).getDay();if(w>0&&w<6)n++}return n};function update(){const now=new Date(),w=now.getDay(),weekday=w>0&&w<6,mins=now.getHours()*60+now.getMinutes()+now.getSeconds()/60,elapsed=weekday?Math.max(0,Math.min(540,mins-480)):0,perDay=40000/days(now.getFullYear(),now.getMonth()),pay=perDay*elapsed/540;$('earned').textContent=fmt(pay);$('rate').textContent='每秒 +'+fmt(perDay/32400)+' · 午休持續累積';$('bar').style.width=(elapsed/540*100)+'%';$('clock').textContent='已冒險 '+Math.floor(elapsed/60)+' 小時 '+Math.floor(elapsed%60)+' 分';$('remaining').textContent='距離下班 '+Math.floor((540-elapsed)/60)+' 小時 '+Math.floor((540-elapsed)%60)+' 分';$('status').textContent=weekday&&mins>=480&&mins<1020?'冒險進行中':'休息時間';$('boss').textContent='HP '+Math.max(0,100-Math.floor(elapsed/5.4)-save.hits*2)+'%';$('petText').textContent='親密度 '+save.food+' · 今日已餵食 '+save.food+' 次';$('achList').innerHTML=[['今天還沒辭職',true],['第一次反擊魔王',save.hits>0],['寶箱收藏家',save.chests>=3],['貓咪御膳房',save.food>=5],['百戰社畜',save.hits>=100]].map(([name,done])=>'<li>'+(done?'已達成 · ':'尚未解鎖 · ')+name+'</li>').join('')};function notice(s){$('notice').textContent=s};$('attack').addEventListener('click',()=>{save.hits++;store();notice(['勇者使出裝忙斬！','魔王受到精神傷害。','距離自由又近了一點。'][save.hits%3]);update()});$('chest').addEventListener('click',()=>{save.chests++;store();notice(['獲得：準時下班的希望','獲得：摸魚護身符','獲得：會議免疫藥水','獲得：傳說級星期五'][save.chests%4]);update()});$('feed').addEventListener('click',()=>{save.food++;store();update();$('petText').textContent='小貓吃飽了。親密度 '+save.food});$('demo').addEventListener('click',()=>{save.bonus++;store();alert('測試成功！已完成一次模擬冒險，真實薪水不變。')});document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['home','pet','achievements'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab));update()}));update();setInterval(update,1000)})();
</script></body></html>
