<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142735"><title>薪水勇者</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf0e9;background:#0e1b25}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;padding:22px 18px 85px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{font-size:22px;margin:0}small,.muted{color:#9eafa9}.pill{border:1px solid #45615b;border-radius:50px;padding:6px 11px;font-size:12px}.panel{background:#1a303a;border:1px solid #37515a;border-radius:20px;padding:20px;margin-bottom:14px}.money{text-align:center;padding:30px 8px}.money strong{display:block;font-size:42px;letter-spacing:-1px;color:#f0d18a;margin:8px 0;font-variant-numeric:tabular-nums}.progress{height:9px;border-radius:20px;background:#334b50;overflow:hidden;margin:15px 0}.fill{height:100%;background:#dfb96f;width:0%;transition:width .4s}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.scene{height:170px;background:linear-gradient(#284852,#172c39);border-radius:14px;position:relative;overflow:hidden;margin:15px 0}.moon{position:absolute;right:40px;top:25px;width:38px;height:38px;border-radius:50%;background:#f5d49a}.hill{position:absolute;bottom:-48px;width:130%;left:-15%;height:130px;border-radius:50%;background:#284b48}.hero{position:absolute;bottom:25px;left:21%;width:65px;height:80px}.hero:before{content:'';position:absolute;width:40px;height:40px;border-radius:13px 13px 16px 16px;background:#f0c5a0;left:13px;top:4px;box-shadow:0 -9px #28364b}.hero:after{content:'';position:absolute;width:56px;height:35px;border-radius:14px 14px 5px 5px;background:#73999a;bottom:0;left:5px}.monster{position:absolute;right:18%;bottom:23px;width:70px;height:55px;background:#b57f9c;border-radius:50% 50% 38% 38%;box-shadow:inset 0 -10px #935b7c}.monster:after{content:'•   •';position:absolute;left:23px;top:12px;color:#2e2835}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}button{border:1px solid #58706b;background:#29474d;color:#f4f2e8;padding:14px 10px;border-radius:13px;font-size:15px;font-weight:600;cursor:pointer}button:active{transform:scale(.98);background:#426b68}button.primary{background:#b78a4e;color:#101e27;border-color:#d1a765}.tabs{position:fixed;bottom:0;left:0;right:0;background:#142832;border-top:1px solid #37515a;display:flex;justify-content:center;z-index:5}.tabs button{flex:1;max-width:170px;border:0;background:transparent;border-radius:0;font-size:13px;padding:16px 5px}.tabs button.active{color:#f0d18a;border-top:2px solid #f0d18a}.hidden{display:none}.notice{min-height:28px;color:#e8c58b;text-align:center;font-size:13px;margin-top:12px}ul{padding-left:22px;line-height:2}input{background:#0e2029;border:1px solid #58706b;color:white;border-radius:9px;padding:9px;width:100%}
</style></head><body><main class="app"><header><h1>薪水勇者 <small>V3.0</small></h1><span class="pill" id="status">計算中</span></header>
<section id="home"><div class="panel money"><small>今天已獲得的薪水</small><strong id="earned">NT$ 0.00</strong><small id="rate"></small><div class="progress"><div class="fill" id="bar"></div></div><div class="row"><small id="clock"></small><small id="remaining"></small></div></div>
<div class="panel"><div class="row"><b>下班魔王</b><small id="boss"></small></div><div class="scene"><div class="moon"></div><div class="hill"></div><div class="hero"></div><div class="monster"></div></div><p id="adventureStats" class="muted"></p><div class="buttons"><button id="attack" class="primary">升級武器</button><button id="chest">開啟寶箱</button></div><p class="notice" id="notice">勇者正在等待冒險。</p></div></section>
<section id="pet" class="hidden"><div class="panel"><h2>旅途夥伴</h2><p>一隻安靜陪你上班的小貓。</p><div class="scene"><div class="moon"></div><div class="hill"></div><div style="position:absolute;bottom:27px;left:40%;width:90px;height:70px;border-radius:45%;background:#d3a77c"><div style="position:absolute;top:-17px;left:12px;width:22px;height:32px;background:#d3a77c;transform:rotate(-25deg)"></div><div style="position:absolute;top:-17px;right:12px;width:22px;height:32px;background:#d3a77c;transform:rotate(25deg)"></div><div style="text-align:center;margin-top:15px;color:#302b2a">•　•<div>ᴗ</div></div></div></div><p id="petText">陪伴時間累積中</p><div class="progress"><div class="fill" id="petBar"></div></div><button id="feed" class="primary">升級貓咪小屋</button></div></section>
<section id="achievements" class="hidden"><div class="panel"><h2>荒謬成就</h2><ul id="achList"></ul></div><div class="panel"><h2>遊戲設定</h2><p class="muted">月薪 40,000 元，每週一至五 08:00–17:00，包含午休。</p><p class="muted">遊戲依照實際經過的平日 08:00–17:00 累積，無須保持網頁開啟。</p><button id="demo">查看玩法說明</button></div></section></main>
<nav class="tabs"><button class="active" data-tab="home">冒險</button><button data-tab="pet">寵物</button><button data-tab="achievements">成就</button></nav>
<script>
(()=>{
'use strict';
const KEY='salary-hero-v3',oldKey='salary-hero-v21', $=id=>document.getElementById(id);
let s;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch{};if(!s){s={minutes:0,coins:0,weapon:1,home:1,opened:0,claimed:0,last:Date.now(),seeded:false};}
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}};
const fmt=n=>'NT$ '+n.toLocaleString('zh-TW',{minimumFractionDigits:2,maximumFractionDigits:2});
function weekdays(y,m){let n=0;for(let d=1;d<=new Date(y,m+1,0).getDate();d++){let w=new Date(y,m,d).getDay();if(w!==0&&w!==6)n++}return n}
function workMinutes(a,b){let total=0;const cursor=new Date(a);cursor.setHours(0,0,0,0);let count=0;while(cursor.getTime()<b&&count++<370){const w=cursor.getDay();if(w>0&&w<6){const start=cursor.getTime()+8*3600000,end=cursor.getTime()+17*3600000;total+=Math.max(0,Math.min(b,end)-Math.max(a,start))/60000}cursor.setDate(cursor.getDate()+1)}return total}
function settle(){const now=Date.now();if(!s.seeded){const today=new Date();today.setHours(8,0,0,0);const start=today.getTime();const elapsed=workMinutes(start,now);s.minutes+=elapsed;s.coins+=Math.floor(elapsed);s.seeded=true;s.last=now;}else if(now>s.last){const delta=workMinutes(Math.max(s.last,now-370*86400000),now);s.minutes+=delta;s.coins+=delta*(1+(s.weapon-1)/6);s.last=now;}store()}
function notice(t){$('notice').textContent=t}
function update(){settle();const now=new Date(),w=now.getDay(),mins=now.getHours()*60+now.getMinutes()+now.getSeconds()/60,active=w>0&&w<6,elapsed=active?Math.max(0,Math.min(540,mins-480)):0,perDay=40000/weekdays(now.getFullYear(),now.getMonth()),pay=perDay*elapsed/540;
$('earned').textContent=fmt(pay);$('rate').textContent='每秒 +'+fmt(perDay/32400)+' · 午休持續累積';$('bar').style.width=(elapsed/540*100)+'%';$('clock').textContent='今日已上班 '+Math.floor(elapsed/60)+' 小時 '+Math.floor(elapsed%60)+' 分';$('remaining').textContent=active&&mins>=1020?'今日已下班':!active?'週末休息中':mins<480?'等待 08:00 上班':'距離下班 '+Math.floor((540-elapsed)/60)+' 小時 '+Math.floor((540-elapsed)%60)+' 分';$('status').textContent=active&&mins>=480&&mins<1020?'冒險進行中':'休息時間';
const stages=Math.floor(s.minutes/30),chests=Math.floor(s.minutes/90)-s.opened,weaponCost=s.weapon*60,homeCost=s.home*90;
$('boss').textContent='第 '+(stages+1)+' 關 · 自動推進';
$('adventureStats').textContent='累積 '+Math.floor(s.minutes)+' 分鐘 · 金幣 '+Math.floor(s.coins)+' · 武器 Lv.'+s.weapon+' · 已通關 '+stages+' 關';
$('attack').textContent='升級武器 ('+weaponCost+' 金幣)';$('attack').disabled=s.coins<weaponCost;
$('chest').textContent=chests>0?'開啟寶箱 ('+chests+' 可領)':'下個寶箱 '+Math.ceil(90-(s.minutes%90))+' 分鐘';$('chest').disabled=chests<=0;
const petLevel=1+Math.floor(s.minutes/180),petProgress=(s.minutes%180)/180*100;
$('petBar').style.width=petProgress+'%';$('petText').textContent='小貓 Lv.'+petLevel+' · 陪伴 '+Math.floor(s.minutes)+' 分鐘 · 小屋 Lv.'+s.home+' · 下次成長還需 '+Math.ceil(180-s.minutes%180)+' 分鐘';
$('feed').textContent='升級小屋 ('+homeCost+' 金幣)';$('feed').disabled=s.coins<homeCost;
$('achList').innerHTML=[['帶薪呼吸 1 小時',s.minutes>=60],['第一個寶箱',s.opened>=1],['生存 10 小時',s.minutes>=600],['小貓長大了',petLevel>=2],['武器大師',s.weapon>=5],['一週生存王',s.minutes>=2700]].map(([name,done])=>'<li>'+(done?'已達成 · ':'尚未解鎖 · ')+name+'</li>').join('');}
$('attack').addEventListener('click',()=>{settle();const cost=s.weapon*60;if(s.coins<cost)return;s.coins-=cost;s.weapon++;store();notice('武器升到 Lv.'+s.weapon+'！每次通關額外獲得 '+(s.weapon-1)*5+' 金幣。');update()});
$('chest').addEventListener('click',()=>{settle();if(Math.floor(s.minutes/90)<=s.opened)return;s.opened++;const reward=30+s.weapon*10;s.coins+=reward;store();notice('寶箱開啟！獲得 '+reward+' 枚金幣。');update()});
$('feed').addEventListener('click',()=>{settle();const cost=s.home*90;if(s.coins<cost)return;s.coins-=cost;s.home++;store();update()});
$('demo').addEventListener('click',()=>alert('每個平日 08:00–17:00 自動累積金幣與陪伴時間。每 30 分鐘通關，每 90 分鐘可開寶箱，每 180 分鐘小貓成長。關閉網頁也能累積，週末不計時。'));
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['home','pet','achievements'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab));update()}));
update();setInterval(update,1000);
})();
</script></body></html>
