<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>薪水勇者｜動畫播放測試</title><style>body{margin:0;background:radial-gradient(ellipse at 50% 25%,#24395c,#101321 70%);color:#f8e9c7;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center}main{max-width:560px;margin:auto;padding:24px 16px}h1{font-size:24px}p{line-height:1.7;color:#c8d1e4}.stage{height:330px;display:grid;place-items:center;position:relative;border:1px solid #72634c;border-radius:20px;background:linear-gradient(#1d314b,#202c39 70%,#3a3743 70%);overflow:hidden}.stage:after{content:'';position:absolute;bottom:25px;width:170px;height:20px;border-radius:50%;background:#0007;filter:blur(8px)}.hero{width:185px;height:220px;object-fit:contain;position:relative;z-index:2;image-rendering:auto;filter:drop-shadow(0 7px 5px #0009)}.hero.idle{animation:idle 1.1s ease-in-out infinite}.hero.attack{animation:attack .65s ease-in-out infinite}.hero.hurt{animation:hurt .55s ease-in-out infinite}.hero.victory{animation:victory .9s ease-in-out infinite}@keyframes idle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-9px) scale(1.025)}}@keyframes attack{0%,100%{transform:translateX(0) rotate(0)}45%{transform:translateX(45px) rotate(12deg)}70%{transform:translateX(22px) rotate(-5deg)}}@keyframes hurt{0%,100%{transform:translateX(0);filter:drop-shadow(0 7px 5px #0009)}30%{transform:translateX(-15px);filter:brightness(2) sepia(1) saturate(5) hue-rotate(300deg)}65%{transform:translateX(8px)}}@keyframes victory{0%,100%{transform:translateY(0)}50%{transform:translateY(-35px) rotate(-7deg)}}button{padding:12px 17px;margin:7px 3px;background:#293f64;color:#fff;border:1px solid #a9915d;border-radius:12px;font-size:16px}button[aria-pressed=true]{background:#876329}.note{font-size:13px;color:#d3b988}a{color:#e7c985}</style></head><body><main><h1>⚔ 薪水勇者 · 動畫播放測試</h1><p>這是 iPhone Safari 網頁播放測試，不需要下載影片。</p><div class="stage"><img id="hero" class="hero idle" src="./art/monster-goblin.svg" alt="動畫測試角色"></div><div><button aria-pressed="true" data-m="idle">待機</button><button aria-pressed="false" data-m="attack">攻擊</button><button aria-pressed="false" data-m="hurt">受傷</button><button aria-pressed="false" data-m="victory">勝利</button></div><p id="status" role="status">播放中：待機</p><p class="note">注意：此頁暫用現有 SVG 怪物測試網頁動畫播放功能，並非新勇者 17 張影格，也不代表高畫質素材已整合。</p><p><a href="./?v=17.1">返回正式遊戲 V17.1</a></p></main><script>const hero=document.getElementById('hero'),status=document.getElementById('status'),names={idle:'待機',attack:'攻擊',hurt:'受傷',victory:'勝利'};document.querySelectorAll('button[data-m]').forEach(b=>b.addEventListener('click',()=>{hero.className='hero '+b.dataset.m;status.textContent='播放中：'+names[b.dataset.m];document.querySelectorAll('button[data-m]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));hero.onerror=()=>{status.textContent='素材載入失敗，請回報此訊息'};</script></body></html>
