<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>薪水勇者 V18 美術整合試驗</title><style>*{box-sizing:border-box}body{margin:0;background:#100c18;color:#fff;font-family:-apple-system,system-ui,sans-serif}.wrap{width:min(100%,520px);margin:auto;position:relative}.art{display:block;width:100%;height:auto;aspect-ratio:1199/1312;object-fit:cover}.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;text-align:center;background:linear-gradient(140deg,#3a2a42,#121222);border:2px solid #b7854a}.fallback p{line-height:1.7}.hit{position:absolute;display:block;border:0;background:transparent;color:transparent;cursor:pointer;border-radius:12px;touch-action:manipulation}.hit:focus-visible{outline:3px solid #5be2ff;background:#3ed4ff44}.hit:active{background:#ffda5a44}.money{position:absolute;top:18.5%;left:73%;width:24%;text-align:center;font-size:clamp(10px,2.8vw,16px);font-weight:800;text-shadow:0 1px 3px #000,0 0 6px #000;color:#ffe6aa;pointer-events:none}.overlay{position:fixed;inset:0;background:#080611d9;display:none;place-items:center;padding:16px;z-index:10}.overlay.show{display:grid}.dialog{max-width:450px;background:#241829;border:2px solid #f3bd65;border-radius:18px;padding:20px;box-shadow:0 15px 40px #000;color:#ffe5b7}.dialog button{padding:12px;border-radius:10px;border:1px solid #d5a460;background:#55364a;color:#fff;margin:5px}.hint{max-width:520px;margin:auto;padding:10px 15px;font-size:12px;line-height:1.7;color:#d4b99d}.hint a{color:#ffe3a4}.debug{position:fixed;top:4px;right:4px;background:#21182ad9;border:1px solid #a87649;padding:5px 8px;border-radius:8px;font-size:11px;z-index:4} .mood{position:absolute;top:25.7%;left:40%;width:25%;padding:5px 3px;background:#281a35d9;border:1px solid #d9a66b;border-radius:12px;text-align:center;color:#ffe5bb;font-size:clamp(9px,2.4vw,13px);box-shadow:0 3px 14px #0009;pointer-events:none;transition:transform .2s,opacity .2s}.mood.bounce{transform:translateY(-8px) rotate(-3deg)}.mood small{display:block;color:#fff2d6}.event{position:absolute;top:32%;left:10%;width:80%;background:#20142ee8;border:1px solid #efc16b;border-radius:12px;padding:8px;text-align:center;color:#ffe5b7;font-size:clamp(11px,2.6vw,14px);opacity:0;pointer-events:none;transition:opacity .3s}.event.show{opacity:1}.workbtn{position:absolute;left:33%;top:15%;width:35%;height:16%;border:0;background:transparent;cursor:pointer}.workbtn:focus-visible{outline:2px solid #ffd879}.fallback{pointer-events:none}</style></head><body><main class="wrap" id="wrap"><img class="art" id="art" src="./art/v18/home-master.webp" alt="薪水勇者 V18 首頁完整美術稿"><div class="fallback" id="fallback"><p><b>V18.2 美術檔尚未部署</b><br>互動程式已建立，但高畫質首頁圖片尚未上傳至 <code>art/v18/home-master.webp</code>。<br>不會用舊 SVG 假裝成正式美術。</p></div><button class="workbtn" id="workbtn" aria-label="觸發摸魚小劇場"></button><div class="mood" id="mood">💤 睡夢冒險中<small>點一下辦公桌試試</small></div><div class="event" id="event" aria-live="polite"></div><div class="money" id="earn">NT$ 1,256.70</div><button class="hit" style="left:1%;top:39%;width:18%;height:24%" data-action="auto" aria-label="切換自動戰鬥"></button><button class="hit" style="left:1%;top:62%;width:18%;height:11%" data-action="speed" aria-label="切換戰鬥速度"></button><button class="hit" style="left:80%;top:38%;width:19%;height:35%" data-action="loot" aria-label="查看戰利品"></button><button class="hit" style="left:22%;top:35%;width:55%;height:37%" data-action="battle" aria-label="查看戰鬥"></button><button class="hit" style="left:1%;top:77%;width:15%;height:19%" data-action="home" aria-label="首頁"></button><button class="hit" style="left:16%;top:77%;width:14%;height:19%" data-action="character" aria-label="角色"></button><button class="hit" style="left:30%;top:77%;width:13%;height:19%" data-action="adventure" aria-label="冒險"></button><button class="hit" style="left:43%;top:77%;width:15%;height:19%" data-action="equipment" aria-label="裝備"></button><button class="hit" style="left:58%;top:77%;width:13%;height:19%" data-action="collection" aria-label="藏品"></button><button class="hit" style="left:71%;top:77%;width:12%;height:19%" data-action="pets" aria-label="寵物"></button><button class="hit" style="left:83%;top:77%;width:9%;height:19%" data-action="guild" aria-label="公會"></button><button class="hit" style="left:92%;top:77%;width:8%;height:19%" data-action="shop" aria-label="商店"></button></main><div class="hint"><b>V18.2 獨立整合測試：</b>目前驗證觸控區域、互動彈窗、數值顯示、摸魚小劇場（點辦公桌觸發），不修改正式遊戲存檔。背景圖是整張設計稿的暫時承載方式，未來需拆成角色、場景、UI 等圖層，才可製作真正動畫。<a href="./?v=17.1">返回正式遊戲</a></div><div class="debug" id="debug">V18.2 · 檢查圖片</div><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="title"><div class="dialog"><h2 id="title"></h2><p id="detail"></p><button id="close">返回</button><button id="production">前往正式遊戲</button></div></div><script>const $=s=>document.querySelector(s),names={auto:'自動戰鬥',speed:'戰鬥速度',loot:'戰利品',battle:'戰鬥場景',home:'首頁',character:'角色',adventure:'冒險',equipment:'裝備',collection:'藏品',pets:'寵物',guild:'公會',shop:'商店'};let auto=true,speed=1,sec=0,eventIndex=0;const events=[['💤 呼嚕……再五分鐘','睡覺也是一種職業技能。'],['🐈 橘貓踩到鍵盤！','工作報告被輸入了一整排喵。'],['☕ 咖啡差點打翻！','勇者瞬間清醒，又立刻睡回去。'],['👔 主管巡邏中！','勇者睜眼三秒，假裝認真工作。'],['⚔️ 夢中擊敗魔物！','現實中的勇者露出得意笑容。']];function workEvent(){const e=events[eventIndex++%events.length];$('#mood').textContent=e[0];$('#mood').classList.add('bounce');$('#event').textContent=e[1];$('#event').classList.add('show');setTimeout(()=>{$('#mood').classList.remove('bounce');$('#event').classList.remove('show')},1800)}$('#workbtn').addEventListener('click',workEvent);$('#art').onload=()=>{$('#debug').textContent='V18.2 · 美術已載入';$('#fallback').style.display='none'};$('#art').onerror=()=>{$('#fallback').style.display='flex';$('#debug').textContent='V18.2 · 缺少美術檔'};setInterval(()=>{sec++;if(sec%17===0)workEvent();$('#earn').textContent='NT$ '+(1256.70+sec*.12).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})},1000);function open(title,detail){$('#title').textContent=title;$('#detail').textContent=detail;$('#overlay').classList.add('show')}document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action;if(a==='auto'){auto=!auto;open('自動戰鬥：'+(auto?'ON':'OFF'),'已切換 V18.1 測試頁開關；不影響正式遊戲。')}else if(a==='speed'){speed=speed===1?2:1;open('戰鬥速度 ×'+speed,'這是獨立預覽頁的互動狀態，正式戰鬥速度尚未連接。')}else open(names[a],'此區域可點擊。完整功能與存檔仍在正式版 V17.1；V18.2 目前僅為視覺與觸控整合原型。')}));$('#close').onclick=()=>$('#overlay').classList.remove('show');$('#production').onclick=()=>location.href='./?v=17.1';$('#overlay').onclick=e=>{if(e.target===$('#overlay'))$('#overlay').classList.remove('show')};</script></body></html>
