<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>薪水勇者・地獄星期一副本</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#110a18;color:#fff2df;font-family:system-ui}main{height:100dvh;max-width:480px;margin:auto;position:relative;overflow:hidden;background:#241022}#bg{position:absolute;inset:0;background:linear-gradient(180deg,#290e21a0,#220c2499 58%,#0e091ae0),url('art/v19/runtime/backgrounds/storybook-office.svg') center/cover}#bg:after{content:'';position:absolute;inset:60% -15% 0;background:radial-gradient(ellipse at 50% 35%,#d14b4869,transparent 68%);transform:perspective(400px) rotateX(25deg)}header{position:absolute;z-index:10;top:env(safe-area-inset-top);left:0;right:0;padding:12px;background:linear-gradient(90deg,#4a1729d9,#240c1dd9);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e7a36b}header b{font-size:16px}header small{font-size:10px;color:#ffd39f}#enemy{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:43%;height:23%;display:flex;align-items:center;flex-direction:column;filter:drop-shadow(0 9px 12px #000);z-index:3}#enemy img{max-width:100%;height:85%;object-fit:contain;animation:float 2.4s ease-in-out infinite}#enemy label{background:#2a101e;padding:3px 10px;border-radius:10px;font-size:12px}#hpbar{position:absolute;top:14%;left:17%;right:17%;height:12px;background:#180b16;border:2px solid #edb57c;border-radius:8px;z-index:8;overflow:hidden}#hp{height:100%;width:100%;background:linear-gradient(90deg,#ff8c5e,#b82346);transition:width .3s}#team{position:absolute;inset:0;z-index:5}.actor{position:absolute;width:25%;height:11%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:end;flex-direction:column;transition:left .3s,top .3s}.actor .body{width:67%;height:78%;border-radius:45% 45% 18% 18%;border:1px solid #c78b78;background:radial-gradient(ellipse at 40% 20%,#735066,#231526 75%);box-shadow:0 9px 8px #0009;display:flex;align-items:center;justify-content:center;font-size:10px;color:#ebc9c0}.actor img{max-height:95%;max-width:100%;object-fit:contain;filter:drop-shadow(0 7px 5px #000)}.actor small{font-size:10px;white-space:nowrap;background:#190c19db;border-radius:5px;padding:2px 4px}.actor.hero{height:14%;width:29%}.actor.attack{animation:charge .55s ease-in-out}#effect{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:32px;color:#ffe3a0;text-shadow:0 2px 4px #f24b32;z-index:9;opacity:0;pointer-events:none}#effect.show{animation:pop .7s ease-out}#alert{position:absolute;z-index:9;top:9%;left:0;right:0;text-align:center;font-weight:800;font-size:12px;color:#ffe3ae;text-shadow:0 2px 5px #000}footer{position:absolute;z-index:12;bottom:0;left:0;right:0;padding:9px 10px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(#3e202b,#1b101e);border-top:2px solid #cf8a60}footer .line{display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr;gap:6px}button{font:700 12px system-ui;color:#ffe7ca;background:linear-gradient(#70444d,#392335);border:1px solid #c58c68;border-radius:10px;min-height:51px}button.primary{background:linear-gradient(#ef9c4f,#a63843);color:white;border-color:#ffe0a0}button.on{background:linear-gradient(#b17d3d,#6a402b)}#status{text-align:center;font-size:11px;color:#f7cda8;padding:5px}#note{text-align:center;font-size:9px;color:#d4b4ad;margin:7px 0 0}@keyframes float{50%{transform:translateY(-7px)}}@keyframes charge{50%{transform:translate(5%,-125%) scale(1.2)}}@keyframes pop{20%{opacity:1;transform:translate(-50%,-20px) scale(1.3)}100%{opacity:0;transform:translate(-50%,-55px)}}@media(max-height:670px){header{padding:7px}button{min-height:42px}#note{display:none}} #enemy{top:17%;height:30%;width:65%;overflow:hidden}#enemy img{width:400%;max-width:none;max-height:none;height:75%;object-fit:fill;object-position:left;align-self:flex-start;animation:none}#enemy label{position:absolute;bottom:0;left:50%;transform:translateX(-50%);white-space:nowrap}#team{bottom:160px;top:0;overflow:hidden}.actor{height:12%}.actor.hero{height:14%}.actor.attack{animation:charge .55s ease-in-out}footer{min-height:145px}.controls{display:grid;grid-template-columns:repeat(4,1fr)}button:disabled{opacity:.7} </style></head><body><main><div id="bg"></div><header><b>地獄星期一</b><small>第 4 波 · 魔王房</small></header><div id="alert">⚠ 截止日魔鐘正在催交報告</div><div id="hpbar"><div id="hp"></div></div><div id="enemy"><img src="art/v19/runtime/monsters/deadline-clock/idle.webp" alt="魔王"><label>截止日魔鐘</label></div><div id="team"></div><div id="effect"></div><footer><div id="status">六名同事 + 薪奴 · 動態編隊</div><div class="line"><button id="speed">速度 ×1</button><button id="pause">暫停</button><button id="restart" class="primary">重新挑戰</button><button id="auto" disabled>自動戰鬥中</button></div><p id="note">可操作副本戰場測試 · 未完成同事美術以剪影表示 · 不讀取正式存檔</p></footer></main><script>const names=['打卡守衛','逃班鬥士','截止日刺客','試算表法師','咖啡醫官','機械工程師'];const slots=[[17,67],[50,67],[83,67],[17,55],[50,55],[83,55],[50,78]];let swapped=false,shift=0,health=100,turn=0,auto=null,busy=false;const team=document.querySelector('#team');function draw(){team.replaceChildren();for(let i=0;i<7;i++){const n=i===6?'薪奴':names[(i+shift)%6],pos=slots[i===6?6:swapped?(i+3)%6:i],a=document.createElement('div');a.className='actor'+(i===6?' hero':'');a.style.left=pos[0]+'%';a.style.top=pos[1]+'%';a.style.zIndex=String(Math.round(pos[1]));a.dataset.actor=n;const body=document.createElement('div');body.className='body';if(i===6){const im=document.createElement('img');im.src='art/v19/candidates/characters/starter/chibi/idle-candidate.webp';im.alt='薪奴';im.onerror=()=>{im.remove();body.textContent='薪奴'};body.append(im)}else{body.textContent='美術待製'}const label=document.createElement('small');label.textContent=n;a.append(body,label);team.append(a)}}function attack(){if(busy)return;busy=true;const units=[...team.children];const unit=units[turn%units.length];turn++;unit.classList.add('attack');const dmg=420+turn*73;health=Math.max(0,health-7);document.querySelector('#hp').style.width=health+'%';const e=document.querySelector('#effect');e.textContent='-'+dmg;e.classList.remove('show');void e.offsetWidth;e.classList.add('show');document.querySelector('#alert').textContent='連攜攻擊！擊破加班結界';setTimeout(()=>{unit.classList.remove('attack');busy=false;document.querySelector('#alert').textContent='⚠ 截止日魔鐘正在催交報告';if(health===0){health=100;document.querySelector('#hp').style.width='100%'}},650)}let rate=1;let paused=false;
function begin(){if(auto)clearInterval(auto);auto=setInterval(attack,1100/rate)}
document.querySelector('#speed').onclick=e=>{rate=rate===1?2:rate===2?3:1;e.currentTarget.textContent='速度 ×'+rate;if(!paused)begin()};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'繼續':'暫停';if(paused){clearInterval(auto);auto=null}else begin()};
document.querySelector('#restart').onclick=()=>{health=100;turn=0;document.querySelector('#hp').style.width='100%';document.querySelector('#alert').textContent='⚠ 截止日魔鐘正在催交報告';draw();if(!paused)begin()};
draw();begin()</script></body></html>
